<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Turbo Estrada</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none;
    font-family: system-ui, sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { width: 100%; max-width: calc(100vh * 16 / 9); aspect-ratio: 16 / 9; background: #000; }
  #touch { position: fixed; left: 0; right: 0; bottom: 0; display: none; justify-content: space-between;
    align-items: flex-end; padding: 12px max(12px, env(safe-area-inset-right)) 12px max(12px, env(safe-area-inset-left)); pointer-events: none; }
  #touch .grp { display: flex; gap: 12px; align-items: flex-end; pointer-events: auto; }
  #touch .col { display: flex; flex-direction: column; gap: 10px; }
  #touch button, #pauseBtn {
    width: 76px; height: 76px; border-radius: 50%; border: 2px solid rgba(255,255,255,.55);
    background: rgba(0,0,0,.35); color: #fff; font-size: 24px; font-weight: 700; padding: 0;
    touch-action: none; -webkit-user-select: none; user-select: none;
  }
  #touch button.small { width: 56px; height: 56px; font-size: 17px; border-radius: 14px; }
  #touch button.on { background: rgba(255,255,255,.32); }
  #pauseBtn { position: fixed; top: 8px; right: max(8px, env(safe-area-inset-right)); width: 48px; height: 48px;
    font-size: 18px; display: none; border-radius: 12px; }
  @media (pointer: coarse) {
    body[data-mode="race"] #touch { display: flex; }
    body[data-mode="race"] #pauseBtn { display: block; }
  }
  body:not([data-gears="1"]) #touch .gear { display: none; }
  body[data-autogas="1"] #touch [data-k="up"] { display: none; }
</style>
</head>

<div id="wrap"><canvas id="game"></canvas></div>
<button id="pauseBtn">II</button>
<div id="touch">
  <div class="grp">
    <button data-k="left">◀</button>
    <button data-k="right">▶</button>
  </div>
  <div class="grp">
    <div class="col">
      <button class="small gear" data-k="gearUp">M+</button>
      <button class="small gear" data-k="gearDown">M−</button>
    </div>
    <button data-k="nitro">N</button>
    <button data-k="down">▼</button>
    <button data-k="up">▲</button>

</div>
<script>
'use strict';
// Turbo Estrada — campeonato de corrida pseudo-3D (estrada por segmentos projetados), sem assets externos.

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 960, H = 540;
canvas.width = W; canvas.height = H;
const IS_TOUCH = matchMedia('(pointer: coarse)').matches;

// ================================================================ constantes
const STEP = 1 / 60;
const SEG = 200, RUMBLE = 3, ROADW = 2000, LANES = 3;
const FOV = 100, CAMH = 1000, DRAW = IS_TOUCH ? 220 : 300;
const camDepth = 1 / Math.tan((FOV / 2) * Math.PI / 180);
const playerZ = CAMH * camDepth;
const MAXSPEED = SEG / STEP;
const BASE_ACCEL = MAXSPEED / 5.5, BRAKE = -MAXSPEED * 0.9, DECEL = -MAXSPEED / 5;
const OFF_DECEL = -MAXSPEED / 2, OFF_LIMIT = MAXSPEED / 4, CENTRIFUGAL = 0.18;
const CARW = 560, CAR_COLLIDE = CARW / ROADW;
const LAPS = 3, NITRO_TIME = 2.5, NITRO_BOOST = 1.3, KMH = 240;
const TUNNEL_H = 2600, TUNNEL_X = 1.35;
const PIT_START = 8, PIT_END = 70, PIT_ENTRY = 45; // boxes em [PIT_START, PIT_END); faixa começa PIT_ENTRY segmentos antes da linha
const GEARS = [0.3, 0.48, 0.66, 0.84, 1.0];      // fração da vel. máxima em cada marcha
const TORQUE = [1.7, 1.35, 1.1, 0.95, 0.8];
const POINTS = [10, 8, 6, 5, 4, 3, 2, 1];
const PRIZE = [6000, 4500, 3500, 2500, 1800, 1200, 800, 500];
const START_MONEY = 3000;

const UPGRADES = [
  { id: 'motor',  name: 'Motor',  desc: '+6% de velocidade máxima',       cost: [3000, 6000, 10000] },
  { id: 'cambio', name: 'Câmbio', desc: '+15% de aceleração',             cost: [2000, 4500, 8000] },
  { id: 'pneus',  name: 'Pneus',  desc: 'Mais aderência em curva e terra', cost: [2000, 4000, 7000] },
  { id: 'nitro',  name: 'Nitro',  desc: '+1 carga de nitro por corrida',  cost: [1500, 3000, 5000] },
  { id: 'tanque', name: 'Tanque', desc: '-15% de consumo de combustível', cost: [1500, 3000, 5000] },
  { id: 'chassi', name: 'Chassi', desc: '-20% de dano nas batidas',       cost: [1500, 3000, 5000] },
];
const DIFFS = [
  // catchup: quanto um rival atrás de você pode acelerar; ease: quanto um rival à frente alivia
  { name: 'Fácil',   base: 0.80, catchup: 0.04, ease: 0.14 },
  { name: 'Normal',  base: 0.86, catchup: 0.07, ease: 0.10 },

];

const PLAYER_NAME = 'VOCÊ';
const PLAYER_COLOR = ['#d32f2f', '#7f1414'];
const RIVALS = [
  { name: 'Raio',    color: ['#1e88e5', '#0d47a1'] },
  { name: 'Faísca',  color: ['#fdd835', '#9e8400'] },
  { name: 'Trovão',  color: ['#43a047', '#1b5e20'] },
  { name: 'Cometa',  color: ['#8e24aa', '#4a148c'] },
  { name: 'Vulcão',  color: ['#fb8c00', '#9a5000'] },
  { name: 'Tufão',   color: ['#00acc1', '#005f6b'] },
  { name: 'Ciclone', color: ['#eceff1', '#8a9aa3'] },
];
const SIGN_TEXTS = ['TURBO', 'PISA FUNDO', 'NITRO', 'VAI!', 'CURVAS', 'ACELERA', 'BOX ►'];

// ================================================================ temas / pistas
const THEMES = [
  { name: 'Vale Verde', desc: 'Colinas suaves para aquecer o motor.', seed: 11, length: 1600,
    sky: ['#1d4f9e', '#b5dcf3'], fog: '#b5dcf3', fogDensity: 5, far: '#7a93b8', near: '#4f8a5b', bg: 'mountains',
    sun: { color: '#fff6d0', x: 0.78, y: 0.16, r: 30 },
    road: ['#6b6b6b', '#646464'], grass: ['#3fa34d', '#37923f'], rumble: ['#efefef', '#c8202a'], lane: '#efefef',
    dust: '#7a9a45', grip: 1, curve: 0.9, hill: 1, tunnels: 1, density: 0.55,
    sprites: [['tree', 4], ['pine', 1], ['bush', 2]] },
  { name: 'Cânion do Sol', desc: 'Retas longas no deserto. Cuidado com os cactos.', seed: 23, length: 1700,
    sky: ['#e2783a', '#ffd9a0'], fog: '#f6cf9c', fogDensity: 4, far: '#b65f3a', near: '#c98a4f', bg: 'mesas',
    sun: { color: '#fff1c4', x: 0.25, y: 0.2, r: 38 },
    road: ['#77706a', '#706964'], grass: ['#dcb672', '#d3aa63'], rumble: ['#f2f2f2', '#b23a2a'], lane: '#f2e6c8',
    dust: '#d9b26f', grip: 0.95, curve: 0.8, hill: 0.7, tunnels: 1, density: 0.35,
    sprites: [['cactus', 4], ['rock', 3], ['bush', 1]] },
  { name: 'Costa Dourada', desc: 'Beira-mar ao pôr do sol, cheia de curvas.', seed: 37, length: 1700,
    sky: ['#4a2a7a', '#ff9e5e'], fog: '#ffb68a', fogDensity: 4.5, far: '#2f6f9f', near: '#d7b56d', bg: 'sea',
    sun: { color: '#ffd27a', x: 0.6, y: 0.42, r: 44 },
    road: ['#6d6a6f', '#666369'], grass: ['#e8cf8f', '#dfc380'], rumble: ['#ffffff', '#1e7fc2'], lane: '#ffffff',
    dust: '#e8cf8f', grip: 1, curve: 1.15, hill: 0.6, tunnels: 1, density: 0.45,
    sprites: [['palm', 5], ['rock', 1], ['bush', 1]] },
  { name: 'Serra da Chuva', desc: 'Pista molhada, menos aderência e relâmpagos.', seed: 41, length: 1750,
    sky: ['#2f3a45', '#8d9aa5'], fog: '#8d9aa5', fogDensity: 7, far: '#4d5b66', near: '#2f5338', bg: 'mountains',
    sun: null, weather: 'rain',
    road: ['#4a4f55', '#464b51'], grass: ['#2f6b3a', '#2a6034'], rumble: ['#d8d8d8', '#a02020'], lane: '#d8d8d8',
    dust: '#3d5a32', grip: 0.85, curve: 1, hill: 1.2, tunnels: 2, density: 0.6,
    sprites: [['pine', 5], ['tree', 2], ['rock', 1]] },
  { name: 'Pico Gelado', desc: 'Neve e gelo: a pista escorrega muito.', seed: 53, length: 1750,
    sky: ['#6f8fb5', '#e3eef7'], fog: '#e3eef7', fogDensity: 6, far: '#c9d6e6', near: '#f4f8fb', bg: 'mountains',
    sun: { color: '#ffffff', x: 0.7, y: 0.14, r: 24 }, weather: 'snow',
    road: ['#7b8088', '#757a82'], grass: ['#f2f6fa', '#e3ebf2'], rumble: ['#ffffff', '#2a6fbf'], lane: '#ffffff',
    dust: '#ffffff', grip: 0.78, curve: 0.9, hill: 1.4, tunnels: 2, density: 0.55,
    sprites: [['snowpine', 5], ['rock', 1]] },
  { name: 'Metrópole Neon', desc: 'A final: cidade à noite, túneis e muitas curvas.', seed: 67, length: 1800,
    sky: ['#05060f', '#2a1d55'], fog: '#1b1638', fogDensity: 6, far: '#141230', near: '#1e1a40', bg: 'skyline',
    sun: { color: '#f4f1e0', x: 0.2, y: 0.14, r: 20, moon: true }, night: true,
    road: ['#2d2d35', '#292931'], grass: ['#3a3a46', '#33333e'], rumble: ['#ffd400', '#26262e'], lane: '#e0e0e0',
    dust: '#555566', grip: 0.95, curve: 1.2, hill: 0.4, tunnels: 3, density: 0.75,
    sprites: [['building', 1]] },
];

// ================================================================ utilidades
const U = {
  clamp: (v, a, b) => Math.max(a, Math.min(b, v)),
  interp: (a, b, p) => a + (b - a) * p,
  easeIn: (a, b, p) => a + (b - a) * p * p,
  easeInOut: (a, b, p) => a + (b - a) * (-Math.cos(p * Math.PI) / 2 + 0.5),
  pctRem: (n, total) => (n % total) / total,
  increase(start, inc, max) {
    let r = start + inc;
    while (r >= max) r -= max;
    while (r < 0) r += max;
    return r;
  },
  overlap(x1, w1, x2, w2, pct) {
    const h = (pct || 1) / 2;
    return !((x1 + w1 * h) < (x2 - w2 * h) || (x1 - w1 * h) > (x2 + w2 * h));
  },
};
function seeded(seed) { // mulberry32
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function fmt(t) {
  if (t == null || !isFinite(t)) return '--:--.--';
  const m = Math.floor(t / 60), s = t - m * 60;
  return `${m}:${s < 10 ? '0' : ''}${s.toFixed(2)}`;
}
const money = v => '$' + Math.round(v).toLocaleString('pt-BR');

// ================================================================ save
const SAVE_KEY = 'turboEstrada.v2.career', OPT_KEY = 'turboEstrada.v2.opts';
function loadJSON(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function saveJSON(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sem storage */ } }
const opts = Object.assign({ diff: 1, manual: false, autoGas: IS_TOUCH, sound: true }, loadJSON(OPT_KEY) || {});
let career = loadJSON(SAVE_KEY);
function saveOpts() { saveJSON(OPT_KEY, opts); }
function saveCareer() { saveJSON(SAVE_KEY, career); }

function newCareer() {
  const points = { [PLAYER_NAME]: 0 };
  for (const r of RIVALS) points[r.name] = 0;
  career = { race: 0, money: START_MONEY, up: Object.fromEntries(UPGRADES.map(u => [u.id, 0])), points, history: [] };
  saveCareer();
}
const lvl = id => (career ? career.up[id] : 0);

// ================================================================ pista
let T = THEMES[0], PAL = null;
let segments = [], trackLength = 0;

function makePalette(t) {
  const tun = ['#2b2b30', '#26262b'];
  return {
    light: { road: t.road[0], grass: t.grass[0], rumble: t.rumble[0], lane: t.lane },
    dark:  { road: t.road[1], grass: t.grass[1], rumble: t.rumble[1] },
    tlight: { road: t.road[0], grass: tun[0], rumble: t.rumble[0], lane: t.lane },
    tdark:  { road: t.road[1], grass: tun[1], rumble: t.rumble[1] },
  };
}
function lastY() { return segments.length ? segments[segments.length - 1].p2.world.y : 0; }
function findSegment(z) { return segments[Math.floor(z / SEG) % segments.length]; }

function addSegment(curve, y) {
  const n = segments.length;
  segments.push({
    index: n,
    p1: { world: { y: lastY(), z: n * SEG }, camera: {}, screen: {} },
    p2: { world: { y, z: (n + 1) * SEG }, camera: {}, screen: {} },
    curve, sprites: [], cars: [],
    color: Math.floor(n / RUMBLE) % 2 ? PAL.dark : PAL.light,
  });
}
function addRoad(enter, hold, leave, curve, height) {
  const sy = lastY(), ey = sy + height * SEG, total = enter + hold + leave;
  for (let n = 0; n < enter; n++) addSegment(U.easeIn(0, curve, n / enter), U.easeInOut(sy, ey, n / total));
  for (let n = 0; n < hold; n++)  addSegment(curve, U.easeInOut(sy, ey, (enter + n) / total));
  for (let n = 0; n < leave; n++) addSegment(U.easeInOut(curve, 0, n / leave), U.easeInOut(sy, ey, (enter + hold + n) / total));
}

function buildTrack(t) {
  T = t; PAL = makePalette(t);
  const rnd = seeded(t.seed);
  const ri = n => Math.floor(rnd() * n);
  const hillDir = () => (lastY() > 0 ? (rnd() < 0.65 ? -1 : 1) : (rnd() < 0.65 ? 1 : -1));
  segments = [];
  const candidates = [];
  addRoad(0, 100, 0, 0, 0); // reta de largada com boxes
  while (segments.length < t.length) {
    const r = rnd(), dir = rnd() < 0.5 ? -1 : 1, start = segments.length;
    if (r < 0.3) addRoad(25 + ri(25), 25 + ri(75), 25 + ri(25), dir * (2 + rnd() * 4) * t.curve, hillDir() * rnd() * 40 * t.hill);
    else if (r < 0.45) for (let i = 0; i < 3; i++) addRoad(25, 25 + ri(25), 25, (i % 2 ? -dir : dir) * (2 + rnd() * 2) * t.curve, hillDir() * rnd() * 20 * t.hill);
    else if (r < 0.55) for (let i = 0; i < 6; i++) addRoad(10, 10, 10, 0, (rnd() * 2 - 1) * 7 * t.hill);
    else if (r < 0.75) addRoad(50, 50 + ri(50), 50, 0, hillDir() * (30 + rnd() * 30) * t.hill);
    else addRoad(50, 75 + ri(75), 50, dir * (4 + rnd() * 2.5) * t.curve, hillDir() * rnd() * 30 * t.hill);
    if (segments.length - start >= 110) candidates.push([start, segments.length]);
  }
  addRoad(100, 100, 100, (rnd() < 0.5 ? -1 : 1) * 2 * t.curve, -lastY() / SEG);
  addRoad(0, 60, 0, 0, 0);
  trackLength = segments.length * SEG;

  for (let i = 0; i < t.tunnels && candidates.length; i++) {
    const [a, b] = candidates.splice(ri(candidates.length), 1)[0];
    for (let n = a + 5; n < b - 5; n++) {
      const s = segments[n];
      s.tunnel = true;
      s.color = Math.floor(n / RUMBLE) % 2 ? PAL.tdark : PAL.tlight;
    }
    segments[a + 5].tunnelEntry = true;
  }
  for (let n = segments.length - PIT_ENTRY; n < segments.length; n++) segments[n].pit = true;
  for (let n = 0; n < PIT_END; n++) { segments[n].pit = true; segments[n].box = n >= PIT_START; }
  segments[0].checker = segments[1].checker = true;
  placeSprites(rnd);
}

function addSprite(n, type, offset, extra) {
  if (segments[n]) segments[n].sprites.push(Object.assign({ type, offset }, extra));
}

function placeSprites(rnd) {
  const side = () => (rnd() < 0.5 ? -1 : 1);
  const pool = T.sprites, totalW = pool.reduce((a, p) => a + p[1], 0);
  const pickType = () => { let r = rnd() * totalW; for (const [t, w] of pool) { if ((r -= w) <= 0) return t; } return pool[0][0]; };
  const len = segments.length, city = T.bg === 'skyline';
  const extra = type => (type === 'building'
    ? { s: 0.8 + rnd() * 0.7, hs: 0.6 + rnd() * 1.3, hue: Math.floor(rnd() * 4), seed: Math.floor(rnd() * 1e6) }
    : { s: 0.8 + rnd() * 0.4 });

  addSprite(0, 'arch', 0.5);
  addSprite(PIT_START - 3, 'boxsign', 2.3);
  for (let n = 20; n < len - 5; n += 3) {
    const seg = segments[n];
    if (seg.tunnel) continue;
    if (rnd() < T.density) {
      const type = pickType(), sd = side();
      let off = sd * ((city ? 1.6 : 1.35) + rnd() * 3);
      if (sd > 0 && seg.pit) off = Math.max(off, 2.4);
      addSprite(n, type, off, extra(type));
    }
    if (rnd() < 0.25) {
      const type = pickType();
      addSprite(n, type, side() * (3 + rnd() * 3.5), extra(type));
    }
  }
  for (let n = 10; n < len; n += city ? 10 : 12) {
    if (segments[n].tunnel) continue;
    const t = city ? 'lamp' : 'post', o = city ? 1.2 : 1.12;
    addSprite(n, t, -o);
    if (!segments[n].pit && n > PIT_END + 20) addSprite(n, t, o);
  }
  for (let n = 40, i = 0; n < len; n += 160, i++) {
    if (!segments[n].tunnel) addSprite(n, 'sign', (segments[n].pit ? -1 : side()) * 1.25, { text: SIGN_TEXTS[i % SIGN_TEXTS.length] });
  }
  for (let n = 0; n < len; n += 8) {
    const c = segments[n].curve;
    if (Math.abs(c) >= 3.5 && !segments[n].tunnel) addSprite(n, 'chevron', c > 0 ? -1.25 : 1.25, { dir: c > 0 ? 1 : -1 });
  }
}

// ================================================================ desenho básico
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2); ctx.fill(); }
function poly(...pts) {
  const color = pts.pop();
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath(); ctx.fill();
}
let lights = []; // fontes de luz noturnas, desenhadas depois do escurecimento
function addLight(x, y, r, color) { if (T.night && r > 0.5) lights.push(x, y, r, color); }

const BUILD_COLORS = [['#2a2c3d', '#ffd98a'], ['#33263a', '#9fe8ff'], ['#24323a', '#ffe9b0'], ['#3a2f2a', '#ffb3e6']];

// w/h em unidades de mundo; hit = fração da largura que colide (0 = atravessável)
const SP = {
  tree: { w: 900, h: 1500, hit: 0.45, draw(cx, by, w, h) {
    ctx.fillStyle = '#6b4423'; ctx.fillRect(cx - w * 0.07, by - h * 0.42, w * 0.14, h * 0.42);
    ctx.fillStyle = '#2e7d32';
    circle(cx, by - h * 0.64, w * 0.4); circle(cx - w * 0.24, by - h * 0.5, w * 0.27); circle(cx + w * 0.24, by - h * 0.5, w * 0.27);
    ctx.fillStyle = '#43a047'; circle(cx - w * 0.1, by - h * 0.72, w * 0.17);
  } },
  pine: { w: 700, h: 1700, hit: 0.35, draw(cx, by, w, h) {
    ctx.fillStyle = '#5d3a1a'; ctx.fillRect(cx - w * 0.06, by - h * 0.2, w * 0.12, h * 0.2);
    poly(cx - w / 2, by - h * 0.18, cx + w / 2, by - h * 0.18, cx, by - h * 0.62, '#1b5e20');
    poly(cx - w * 0.4, by - h * 0.45, cx + w * 0.4, by - h * 0.45, cx, by - h * 0.85, '#236b28');
    poly(cx - w * 0.28, by - h * 0.7, cx + w * 0.28, by - h * 0.7, cx, by - h, '#2e7d32');
  } },
  snowpine: { w: 750, h: 1700, hit: 0.35, draw(cx, by, w, h) {
    ctx.fillStyle = '#5d3a1a'; ctx.fillRect(cx - w * 0.06, by - h * 0.2, w * 0.12, h * 0.2);
    poly(cx - w / 2, by - h * 0.18, cx + w / 2, by - h * 0.18, cx, by - h * 0.62, '#1f4d34');
    poly(cx - w * 0.3, by - h * 0.42, cx + w * 0.3, by - h * 0.42, cx, by - h * 0.62, '#ffffff');
    poly(cx - w * 0.4, by - h * 0.45, cx + w * 0.4, by - h * 0.45, cx, by - h * 0.85, '#245a3c');
    poly(cx - w * 0.22, by - h * 0.7, cx + w * 0.22, by - h * 0.7, cx, by - h * 0.85, '#ffffff');
    poly(cx - w * 0.28, by - h * 0.7, cx + w * 0.28, by - h * 0.7, cx, by - h, '#2b6644');
    poly(cx - w * 0.12, by - h * 0.9, cx + w * 0.12, by - h * 0.9, cx, by - h, '#ffffff');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(cx - w * 0.5, by - h * 0.2, w, h * 0.03);
  } },
  bush: { w: 700, h: 380, hit: 0, draw(cx, by, w, h) {
    const dry = T.bg === 'mesas';
    ctx.fillStyle = dry ? '#8a8a3a' : '#2f8a3a'; ctx.beginPath(); ctx.ellipse(cx, by - h * 0.45, w / 2, h * 0.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = dry ? '#a5a54a' : '#46a650'; ctx.beginPath(); ctx.ellipse(cx - w * 0.12, by - h * 0.6, w * 0.22, h * 0.25, 0, 0, Math.PI * 2); ctx.fill();
  } },

// ================================================================ estado da corrida
let state = 'title', paused = false;
let position = 0, playerX = 0, speed = 0, lap = 0, raceTime = 0, lapStart = 0, lastLap = null, bestLap = null;
let nitros = 0, nitroT = 0, shake = 0, cars = [], gear = 1, rpm = 0, fuel = 100, damage = 0;
let countdown = 0, lastCount = 0, finishT = 0, playerFinish = null, results = null;
let msg = '', msgT = 0, skyOff = 0, hillOff = 0, braking = false, inPit = false, lowFuelWarned = false;
let flash = 0, lightningT = 6;

function playerCarZ() { return U.increase(position, playerZ, trackLength); }
function playerProgress() { return lap * trackLength + playerCarZ(); }
function carProgress(c) { return c.lap * trackLength + c.z; }
function currentPosition() {
  const p = playerProgress();
  return 1 + cars.filter(c => carProgress(c) > p).length;
}

function setupTrack(index) { buildTrack(THEMES[index]); }

function resetRace() {
  for (const s of segments) s.cars.length = 0;
  const z0 = trackLength - SEG * 30; // grid antes da linha, jogador em último
  position = U.increase(z0, -playerZ, trackLength);
  playerX = -0.5; speed = 0; lap = 0; gear = 1; rpm = 0; fuel = 100; damage = 0;
  raceTime = 0; lapStart = 0; lastLap = null; bestLap = null; playerFinish = null; results = null;
  nitros = 2 + lvl('nitro'); nitroT = 0; shake = 0; msg = ''; msgT = 0; flash = 0; lowFuelWarned = false;
  parts.length = 0;
  const raceIdx = career ? career.race : 0;
  const d = DIFFS[opts.diff];
  cars = RIVALS.map((r, i) => {
    const row = Math.floor((i + 1) / 2);
    const car = {
      name: r.name, color: r.color, lap: 0, speed: 0, percent: 0, finishTime: null,
      z: z0 + row * SEG * 5,
      offset: (i + 1) % 2 ? 0.5 : -0.5,
      base: MAXSPEED * (d.base + raceIdx * 0.018 + row * 0.012 + Math.random() * 0.015),
    };
    findSegment(car.z).cars.push(car);
    return car;
  });
}

// ================================================================ áudio
let audio = null;
function initAudio() {
  if (audio) { if (audio.ac.state === 'suspended') audio.ac.resume(); return; }
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), o2 = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
    o.type = 'sawtooth'; o2.type = 'square'; f.type = 'lowpass'; f.frequency.value = 700; g.gain.value = 0;
    const g2 = ac.createGain(); g2.gain.value = 0.3;
    o.connect(f); o2.connect(g2).connect(f); f.connect(g).connect(ac.destination); o.start(); o2.start();
    const len = ac.sampleRate * 0.5, nb = ac.createBuffer(1, len, ac.sampleRate), data = nb.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    audio = { ac, o, o2, g, f, noiseBuf: nb };
  } catch (e) { audio = null; }
}
function beep(freq, dur, vol = 0.08, type = 'square') {
  if (!audio || !opts.sound) return;
  const { ac } = audio, o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
}
function noise(dur, vol, freq) {
  if (!audio || !opts.sound) return;
  const { ac } = audio, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), t = ac.currentTime;
  s.buffer = audio.noiseBuf; f.type = 'lowpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(ac.destination); s.start(t); s.stop(t + dur);
}
function updateAudio() {
  if (!audio) return;
  const t = audio.ac.currentTime;
  const on = opts.sound && !paused && (state === 'race' || state === 'countdown' || state === 'finished');
  const r = state === 'countdown' ? 0.15 + (keys.up ? 0.4 : 0) : rpm;
  const base = 45 + r * 150 + gear * 8 + (nitroT > 0 ? 30 : 0);
  audio.o.frequency.setTargetAtTime(base, t, 0.04);
  audio.o2.frequency.setTargetAtTime(base * 0.5, t, 0.04);
  audio.f.frequency.setTargetAtTime(500 + r * 900, t, 0.05);
  audio.g.gain.setTargetAtTime(on ? 0.025 + r * 0.035 : 0, t, 0.08);
}

// ================================================================ entrada
const keys = { left: false, right: false, up: false, down: false };
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down' };
const isDriving = () => (state === 'race' || state === 'countdown' || state === 'finished') && !paused;

function useNitro() {
  if (state === 'race' && !paused && nitros > 0 && nitroT <= 0 && fuel > 0) {
    nitros--; nitroT = NITRO_TIME; noise(0.8, 0.15, 1800); flash = 0.15;
  }
}
function shift(d) {
  if (!opts.manual || state !== 'race' || paused) return;
  const g = U.clamp(gear + d, 1, GEARS.length);
  if (g !== gear) { gear = g; beep(d > 0 ? 300 : 200, 0.05, 0.04); }
}
function setPaused(p) { if (state === 'race' || state === 'countdown') { paused = p; uiFocus = 0; } }

addEventListener('keydown', e => {
  initAudio();
  if (isDriving()) {
    const k = KEYMAP[e.code];
    if (k) { keys[k] = true; e.preventDefault(); return; }
    if (e.code === 'Space' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') { e.preventDefault(); useNitro(); }
    else if (e.code === 'KeyE' || e.code === 'KeyX') shift(1);
    else if (e.code === 'KeyQ' || e.code === 'KeyZ') shift(-1);
    else if (e.code === 'KeyP' || e.code === 'Escape') setPaused(true);
    else if (e.code === 'KeyM') { opts.sound = !opts.sound; saveOpts(); }
    return;
  }
  // navegação em menus
  if (['ArrowDown', 'ArrowRight', 'KeyS', 'KeyD', 'Tab'].includes(e.code)) { uiFocus = (uiFocus + 1) % Math.max(1, uiButtons.length); e.preventDefault(); }
  else if (['ArrowUp', 'ArrowLeft', 'KeyW', 'KeyA'].includes(e.code)) { uiFocus = (uiFocus - 1 + uiButtons.length) % Math.max(1, uiButtons.length); e.preventDefault(); }
  else if (e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); activate(uiButtons[uiFocus]); }
  else if ((e.code === 'Escape' || e.code === 'KeyP') && paused) setPaused(false);
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden) setPaused(true); });

canvas.addEventListener('pointerdown', e => {
  initAudio();
  if (isDriving()) return;
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  for (let i = uiButtons.length - 1; i >= 0; i--) {
    const b = uiButtons[i];
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { uiFocus = i; activate(b); return; }
  }
});

for (const b of document.querySelectorAll('#touch button')) {
  const k = b.dataset.k;
  const down = e => {
    e.preventDefault(); initAudio(); b.classList.add('on');
    if (k === 'nitro') useNitro();
    else if (k === 'gearUp') shift(1);
    else if (k === 'gearDown') shift(-1);
    else keys[k] = true;
  };
  const up = e => { e.preventDefault(); b.classList.remove('on'); if (k in keys) keys[k] = false; };
  b.addEventListener('pointerdown', down);
  for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) b.addEventListener(ev, up);
}
document.getElementById('pauseBtn').addEventListener('pointerdown', e => { e.preventDefault(); setPaused(true); });

function syncBodyFlags() {
  const ds = document.body.dataset;
  const mode = isDriving() ? 'race' : 'menu', g = opts.manual ? '1' : '0', a = opts.autoGas ? '1' : '0';
  if (ds.mode !== mode) { ds.mode = mode; if (mode === 'menu') for (const k in keys) keys[k] = false; }
  if (ds.gears !== g) ds.gears = g;
  if (ds.autogas !== a) ds.autogas = a;
}

// ================================================================ UI de menus (botões no canvas)
let uiButtons = [], uiFocus = 0;
function activate(b) { if (b && !b.disabled) { beep(660, 0.05, 0.05); b.action(); } }
function goto(s) { state = s; uiFocus = 0; paused = false; }

function button(label, x, y, w, h, action, o = {}) {
  const idx = uiButtons.length;
  uiButtons.push({ x, y, w, h, action, disabled: !!o.disabled });
  const focused = idx === uiFocus && !IS_TOUCH;
  ctx.fillStyle = o.disabled ? 'rgba(60,60,60,0.75)' : o.primary ? 'rgba(200,40,40,0.9)' : 'rgba(20,40,80,0.85)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = focused ? '#ffeb3b' : o.disabled ? '#666' : 'rgba(255,255,255,0.6)';
  ctx.lineWidth = focused ? 4 : 2; ctx.strokeRect(x, y, w, h);
  text(label, x + w / 2, y + h / 2 - (o.size || 20) / 2 - 1, o.size || 20, o.disabled ? '#999' : '#fff', 'center');
}

// ================================================================ fluxo do campeonato
function startRace() {
  setupTrack(career.race);
  resetRace();
  goto('countdown'); countdown = 3.5; lastCount = 5;
}
function finishRace() {
  state = 'finished'; finishT = 3; playerFinish = raceTime;
  noise(0.4, 0.05, 3000);
  beep(currentPosition() === 1 ? 1046 : 523, 0.6, 0.08, 'triangle');
}
function computeResults() {
  const total = (LAPS + 1) * trackLength;
  const list = cars.map(c => ({
    name: c.name, color: c.color,
    time: c.finishTime != null ? c.finishTime : raceTime + Math.max(0, total - carProgress(c)) / Math.max(c.speed, MAXSPEED * 0.5),
    est: c.finishTime == null,
  }));
  list.push({ name: PLAYER_NAME, color: PLAYER_COLOR, time: playerFinish, me: true });
  list.sort((a, b) => a.time - b.time);
  list.forEach((e, i) => { e.pts = POINTS[i]; e.prize = e.me ? PRIZE[i] : 0; });
  const me = list.find(e => e.me), pos = list.indexOf(me) + 1;
  const bonus = bestLap != null && pos === 1 ? 1000 : 0;
  for (const e of list) career.points[e.name] = (career.points[e.name] || 0) + e.pts;
  career.money += me.prize + bonus;
  career.history.push({ track: T.name, pos });
  saveCareer();
  results = { list, pos, prize: me.prize, bonus, track: T.name };
}
function afterResults() {
  career.race++;
  saveCareer();
  if (career.race >= THEMES.length) goto('champion');
  else { setupTrack(career.race); resetRace(); goto('garage'); }
}
function standingsList() {
  return Object.entries(career.points)
    .map(([name, pts]) => ({ name, pts, me: name === PLAYER_NAME, color: name === PLAYER_NAME ? PLAYER_COLOR : RIVALS.find(r => r.name === name).color }))
    .sort((a, b) => b.pts - a.pts || (a.me ? -1 : b.me ? 1 : 0));
}

// ================================================================ lógica da corrida
function showMsg(text, t = 2) { msg = text; msgT = t; }

function update(dt) {
  updateParticles(dt);
  updateWeather(dt);
  if (paused) return;
  if (msgT > 0) msgT -= dt;
  if (shake > 0) shake -= dt;
  if (flash > 0) flash -= dt;

  if (state === 'countdown') {
    countdown -= dt;
    const c = Math.ceil(countdown);
    if (c !== lastCount && c > 0 && c <= 3) { beep(440, 0.15); }
    lastCount = c;
    if (countdown <= 0) { state = 'race'; beep(880, 0.35); showMsg('VAI!', 1); }
    return;
  }
  if (state !== 'race' && state !== 'finished') return;
  if (state === 'finished') { finishT -= dt; if (finishT <= 0) { computeResults(); goto('results'); return; } }

  const L = trackLength;
  const playerSeg = findSegment(position + playerZ);
  const pct = speed / MAXSPEED;
  const dx = dt * 2 * pct;
  const control = state === 'race';
  const prevZ = playerCarZ();
  raceTime += dt;

  updateCars(dt);
  position = U.increase(position, dt * speed, L);

  // volante + força centrífuga (aderência depende da pista e dos pneus)
  if (control) {
    if (keys.left) playerX -= dx;
    else if (keys.right) playerX += dx;
  } else {
    playerX += (0 - playerX) * Math.min(1, dt);
  }
  const grip = T.grip * (1 + 0.12 * lvl('pneus'));
  playerX -= dx * pct * playerSeg.curve * CENTRIFUGAL / grip;

  // limites de velocidade
  inPit = !!playerSeg.pit && playerX > 1.05 && playerX < 2.05;
  let vmax = MAXSPEED * (1 + 0.06 * lvl('motor')) * (1 - damage * 0.003);
  if (fuel <= 0) vmax = Math.min(vmax, MAXSPEED * 0.25);
  if (inPit) vmax = Math.min(vmax, MAXSPEED * 0.35);
  const nitroOn = nitroT > 0;
  const vmaxGear = vmax;
  if (nitroOn) { nitroT -= dt; vmax *= NITRO_BOOST; }

  // câmbio
  if (!opts.manual) {
    if (gear < GEARS.length && speed >= GEARS[gear - 1] * vmaxGear * 0.97) { gear++; }
    else if (gear > 1 && speed < GEARS[gear - 2] * vmaxGear * 0.85) gear--;
  }
  const top = GEARS[gear - 1] * vmaxGear;
  let accel = BASE_ACCEL * (1 + 0.15 * lvl('cambio')) * TORQUE[gear - 1] * (opts.manual ? 1.08 : 1);
  if (gear > 1) { const low = GEARS[gear - 2] * vmaxGear; if (speed < low) accel *= U.clamp(speed / low, 0.25, 1); }
  rpm = U.clamp(speed / top, 0, 1.08);

  braking = control && keys.down;
  const gas = control && (keys.up || (opts.autoGas && !keys.down));
  if (!control) speed += (MAXSPEED * 0.45 - speed) * dt;
  else if (nitroOn) speed += BASE_ACCEL * 2.2 * dt;
  else if (braking) speed += BRAKE * dt;
  else if (gas) { if (speed < top) speed += accel * dt; else speed -= MAXSPEED * 0.05 * dt; }
  else speed += DECEL * dt;
  if (speed > vmax) speed = Math.max(vmax, speed - MAXSPEED * 0.6 * dt);

  // combustível
  if (control) {
    fuel -= dt * pct * 1.2 * (nitroOn ? 2 : 1) * (1 - 0.15 * lvl('tanque'));
    if (fuel <= 0) { fuel = 0; }
    if (fuel < 20 && !lowFuelWarned) { lowFuelWarned = true; showMsg('COMBUSTÍVEL BAIXO! ENTRE NO BOX ►', 3.5); beep(330, 0.3, 0.06); }
  }
  if (inPit && playerSeg.box) {
    fuel = Math.min(100, fuel + 30 * dt);
    damage = Math.max(0, damage - 25 * dt);
    if (fuel > 30) lowFuelWarned = false;
    if (msgT <= 0.1) showMsg('BOX: ABASTECENDO E CONSERTANDO', 0.5);
  }

  // fora da pista e colisões com cenário
  if (!inPit && (playerX < -1 || playerX > 1)) {
    if (speed > OFF_LIMIT) speed += OFF_DECEL * (1 - 0.12 * lvl('pneus')) * dt;
    if (speed > MAXSPEED * 0.1 && Math.random() < 0.6) {
      for (const ex of [-0.33, 0.33]) spawn(W / 2 + ex * 260 + (Math.random() - 0.5) * 30, H - 10, (Math.random() - 0.5) * 120, -40 - Math.random() * 60, 0.6, 8, T.dust, 0, 40);
    }
    for (const sp of playerSeg.sprites) {
      const def = SP[sp.type];
      if (!def.hit) continue;
      const spW = def.w * (sp.s || 1) / ROADW;
      const spX = sp.offset + Math.sign(sp.offset) * spW / 2;
      if (U.overlap(playerX, CAR_COLLIDE, spX, spW * def.hit, 1)) {
        speed = MAXSPEED / 5;
        position = U.increase(playerSeg.p1.world.z, -playerZ, L);
        playerX -= Math.sign(sp.offset) * 0.12; // empurra de volta para a pista
        crash(14);
        break;
      }
    }
  }
  // paredes do túnel
  if (playerSeg.tunnel && Math.abs(playerX) > TUNNEL_X - CAR_COLLIDE / 2) {
    playerX = Math.sign(playerX) * (TUNNEL_X - CAR_COLLIDE / 2 - 0.05);
    if (speed > MAXSPEED * 0.3) { speed *= 0.75; crash(6); }
  }

  // colisão com rivais (batida na traseira)
  outer:
  for (const seg of [playerSeg, segments[(playerSeg.index + 1) % segments.length]]) {
    for (const car of seg.cars) {
      const carAhead = U.increase(car.z, -playerCarZ(), L) < SEG * 2;
      if (carAhead && speed > car.speed && U.overlap(playerX, CAR_COLLIDE, car.offset, CAR_COLLIDE, 0.8)) {
        speed = car.speed * (car.speed / speed);
        position = U.increase(car.z, -playerZ - 10, L);
        car.speed *= 1.03;
        crash(6);
        break outer;
      }
    }
  }

  playerX = U.clamp(playerX, -3, 3);
  speed = U.clamp(speed, 0, MAXSPEED * 1.5);
  damage = U.clamp(damage, 0, 100);

  // contagem de voltas
  const z = playerCarZ();
  if (z < prevZ - L / 2) onLap();
  else if (z > prevZ + L / 2) lap--; // recuou sobre a linha após batida

  if (damage > 60 && Math.random() < damage / 400) spawn(W / 2 + (Math.random() - 0.5) * 60, H - 120, (Math.random() - 0.5) * 40, -90, 1.1, 10, '#555', 0, 50);

  skyOff += 0.001 * playerSeg.curve * pct;
  hillOff += 0.002 * playerSeg.curve * pct;
}

function onLap() {
  lap++;
  if (state !== 'race') return;
  if (lap >= 2) {
    lastLap = raceTime - lapStart;
    bestLap = bestLap == null ? lastLap : Math.min(bestLap, lastLap);
  }
  lapStart = raceTime;
  if (lap > LAPS) finishRace();
  else if (lap === LAPS) { showMsg('VOLTA FINAL!', 2.5); beep(660, 0.25); }
  else if (lap > 1) showMsg(`VOLTA ${lap}  •  ${fmt(lastLap)}`, 2.5);
}

function crash(dmg) {
  shake = 0.35; flash = 0.08;
  damage += dmg * (1 - 0.2 * lvl('chassi'));
  noise(0.3, 0.25, 900); beep(80, 0.25, 0.08, 'sawtooth');
  for (let i = 0; i < 26; i++) {
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.4, v = 200 + Math.random() * 350;
    spawn(W / 2 + (Math.random() - 0.5) * 200, H - 110, Math.cos(a) * v, Math.sin(a) * v, 0.4 + Math.random() * 0.4, 3, Math.random() < 0.5 ? '#ffd54f' : '#ff8f00', 900, 0);
  }
}

function updateCars(dt) {
  const L = trackLength, pp = playerProgress(), d = DIFFS[opts.diff];
  for (const car of cars) {
    const oldSeg = findSegment(car.z);
    car.offset += steerCar(car, oldSeg);
    car.offset = U.clamp(car.offset, -0.85, 0.85);
    // "elástico" + frenagem antes de curvas fortes
    const behind = (pp - carProgress(car)) / L;
    const band = U.clamp(behind * 0.6, -d.ease, d.catchup);
    const ahead = segments[(oldSeg.index + 12) % segments.length];
    const k = Math.max(Math.abs(ahead.curve), Math.abs(oldSeg.curve));
    const target = car.base * (1 + band) * (1 - Math.max(0, k - 2.5) * 0.03);
    car.speed += (target - car.speed) * Math.min(1, dt * 0.6);

    const prev = car.z;
    car.z = U.increase(car.z, dt * car.speed, L);
    if (car.z < prev) { car.lap++; if (car.lap > LAPS && car.finishTime == null) car.finishTime = raceTime; }
    car.percent = U.pctRem(car.z, SEG);
    const newSeg = findSegment(car.z);
    if (newSeg !== oldSeg) {
      oldSeg.cars.splice(oldSeg.cars.indexOf(car), 1);
      newSeg.cars.push(car);
    }
  }
}

function steerCar(car, carSeg) {
  const playerSeg = findSegment(position + playerZ), carW = CAR_COLLIDE;
  for (let i = 1; i < 20; i++) {
    const seg = segments[(carSeg.index + i) % segments.length];
    if (seg === playerSeg && car.speed > speed && U.overlap(playerX, CAR_COLLIDE, car.offset, carW, 1.3)) {
      const dir = playerX > 0.5 ? -1 : playerX < -0.5 ? 1 : (car.offset > playerX ? 1 : -1);
      return dir / i * (car.speed - speed) / MAXSPEED;
    }
    for (const other of seg.cars) {
      if (other !== car && car.speed > other.speed && U.overlap(car.offset, carW, other.offset, carW, 1.3)) {
        const dir = other.offset > 0.5 ? -1 : other.offset < -0.5 ? 1 : (car.offset > other.offset ? 1 : -1);
        return dir / i * (car.speed - other.speed) / MAXSPEED;
      }
    }
  }
  // tende a voltar para a faixa central-ish quando livre
  return -car.offset * 0.002;
}

// ================================================================ partículas e clima
const parts = [];
function spawn(x, y, vx, vy, life, size, color, grav, grow) {
  if (parts.length < 260) parts.push({ x, y, vx, vy, life, max: life, size, color, grav, grow });
}
function updateParticles(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.grav * dt; p.size += p.grow * dt; p.life -= dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
}
function drawParticles() {
  for (const p of parts) {
    ctx.globalAlpha = U.clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.color;
    if (p.grav) ctx.fillRect(p.x, p.y, p.size, p.size); else circle(p.x, p.y, p.size);
  }
  ctx.globalAlpha = 1;
}

const drops = [];
function updateWeather(dt) {
  const w = T.weather;
  const want = w === 'rain' ? (IS_TOUCH ? 90 : 140) : w === 'snow' ? (IS_TOUCH ? 90 : 130) : 0;
  while (drops.length < want) drops.push({ x: Math.random() * W, y: Math.random() * H, s: 0.5 + Math.random() * 0.8, ph: Math.random() * 6 });
  if (drops.length > want) drops.length = want;
  const pct = speed / MAXSPEED;
  for (const d of drops) {
    if (w === 'rain') { d.y += (900 + pct * 500) * d.s * dt; d.x -= (120 + pct * 200) * dt * d.s; }
    else { d.y += (60 + pct * 260) * d.s * dt; d.ph += dt * 2; d.x += Math.sin(d.ph) * 30 * dt - (d.x - W / 2) * pct * 0.6 * dt; }
    if (d.y > H) { d.y = -10; d.x = Math.random() * W * 1.2; }
    if (d.x < -20) d.x += W + 40; else if (d.x > W + 20) d.x -= W + 40;
  }
  if (w === 'rain' && !paused && state !== 'title') {
    lightningT -= dt;
    if (lightningT <= 0) { lightningT = 7 + Math.random() * 9; flash = 0.25; setTimeout(() => noise(1.6, 0.3, 300), 400); }
  }
}
function drawWeather() {
  const w = T.weather;
  if (w === 'rain') {
    ctx.fillStyle = 'rgba(20,30,45,0.18)'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(200,215,235,0.45)'; ctx.lineWidth = 1.2; ctx.beginPath();
    for (const d of drops) { ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - 4 * d.s, d.y + 18 * d.s); }
    ctx.stroke();
  } else if (w === 'snow') {
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    for (const d of drops) ctx.fillRect(d.x, d.y, 2.5 * d.s + 1, 2.5 * d.s + 1);
  }
}

// ================================================================ render do mundo
function project(p, camX, camY, camZ) {
  p.camera.x = -camX;
  p.camera.y = p.world.y - camY;
  p.camera.z = p.world.z - camZ;
  p.screen.scale = camDepth / p.camera.z;
  // arredondar evita frestas anti-aliased entre segmentos
  p.screen.x = Math.round(W / 2 + p.screen.scale * p.camera.x * W / 2);
  p.screen.y = Math.round(H / 2 - p.screen.scale * p.camera.y * H / 2);
  p.screen.w = Math.round(p.screen.scale * ROADW * W / 2);
}

function drawSegment(seg) {
  const a = seg.p1.screen, b = seg.p2.screen, c = seg.color;
  const x1 = a.x, y1 = a.y, w1 = a.w, x2 = b.x, y2 = b.y, w2 = b.w;
  ctx.fillStyle = c.grass; ctx.fillRect(0, y2, W, y1 - y2);
  const r1 = w1 / Math.max(6, 2 * LANES), r2 = w2 / Math.max(6, 2 * LANES);
  if (seg.pit) {
    poly(x1 + w1, y1, x1 + w1 * 2.05, y1, x2 + w2 * 2.05, y2, x2 + w2, y2, c.road);
    poly(x1 + w1 * 1.98, y1, x1 + w1 * 2.05, y1, x2 + w2 * 2.05, y2, x2 + w2 * 1.98, y2, '#f5f5f5');
    if (seg.index % 4 < 2) poly(x1 + w1 * 1.04, y1, x1 + w1 * 1.08, y1, x2 + w2 * 1.08, y2, x2 + w2 * 1.04, y2, '#f5f5f5');
  }
  poly(x1 - w1 - r1, y1, x1 - w1, y1, x2 - w2, y2, x2 - w2 - r2, y2, c.rumble);
  if (!seg.pit) poly(x1 + w1 + r1, y1, x1 + w1, y1, x2 + w2, y2, x2 + w2 + r2, y2, c.rumble);
  poly(x1 - w1, y1, x1 + w1, y1, x2 + w2, y2, x2 - w2, y2, c.road);
  if (seg.checker) {
    const n = 12;
    for (let i = 0; i < n; i++) {
      const la = x1 - w1 + 2 * w1 * i / n, lb = x1 - w1 + 2 * w1 * (i + 1) / n;
      const ua = x2 - w2 + 2 * w2 * i / n, ub = x2 - w2 + 2 * w2 * (i + 1) / n;
      poly(la, y1, lb, y1, ub, y2, ua, y2, (i + seg.index) % 2 ? '#111' : '#fafafa');
    }
  } else if (c.lane) {
    const l1 = w1 / Math.max(32, 8 * LANES), l2 = w2 / Math.max(32, 8 * LANES);
    for (let lane = 1; lane < LANES; lane++) {
      const lx1 = x1 - w1 + 2 * w1 * lane / LANES, lx2 = x2 - w2 + 2 * w2 * lane / LANES;
      poly(lx1 - l1 / 2, y1, lx1 + l1 / 2, y1, lx2 + l2 / 2, y2, lx2 - l2 / 2, y2, c.lane);
    }
  }
  if (T.weather === 'rain' && seg.index % 2 === 0) { // reflexo de pista molhada
    ctx.globalAlpha = 0.08; poly(x1 - w1 * 0.6, y1, x1 + w1 * 0.6, y1, x2 + w2 * 0.6, y2, x2 - w2 * 0.6, y2, '#cfe3ff'); ctx.globalAlpha = 1;
  }
  if (seg.fog < 1) {
    ctx.globalAlpha = 1 - seg.fog; ctx.fillStyle = T.fog;
    ctx.fillRect(0, y2, W, y1 - y2); ctx.globalAlpha = 1;
  }
}

function tunnelPts(p) {
  const s = p.screen, wx = s.w * TUNNEL_X;
  return { l: s.x - wx, r: s.x + wx, yb: s.y, yt: s.y - s.scale * TUNNEL_H * H / 2 };
}
function drawTunnel(seg) {
  const a = tunnelPts(seg.p1), b = tunnelPts(seg.p2), odd = Math.floor(seg.index / 2) % 2;
  const wall = odd ? '#4a4540' : '#433e39';
  poly(a.l, a.yb, a.l, a.yt, b.l, b.yt, b.l, b.yb, wall);
  poly(a.r, a.yb, a.r, a.yt, b.r, b.yt, b.r, b.yb, wall);
  poly(a.l, a.yt, a.r, a.yt, b.r, b.yt, b.l, b.yt, odd ? '#2f2b28' : '#2a2724');
  // faixa de segurança amarela na base das paredes
  const ah = (a.yb - a.yt) * 0.08, bh = (b.yb - b.yt) * 0.08;
  poly(a.l, a.yb, a.l, a.yb - ah, b.l, b.yb - bh, b.l, b.yb, '#c9a400');
  poly(a.r, a.yb, a.r, a.yb - ah, b.r, b.yb - bh, b.r, b.yb, '#c9a400');
  if (seg.index % 6 === 0) { // luminárias no teto
    const cx1 = (a.l + a.r) / 2, cx2 = (b.l + b.r) / 2, lw1 = (a.r - a.l) * 0.06, lw2 = (b.r - b.l) * 0.06;
    poly(cx1 - lw1, a.yt, cx1 + lw1, a.yt, cx2 + lw2, b.yt, cx2 - lw2, b.yt, '#fff6c8');
  }
  if (seg.tunnelEntry) {
    const s = seg.p1.screen, top = a.yt - s.scale * 1400 * H / 2, mid = a.yt - s.scale * 700 * H / 2;
    ctx.fillStyle = T.night ? '#22202a' : T.weather === 'snow' ? '#8f9aa8' : '#6d6258';
    ctx.beginPath(); // morro em volta da boca do túnel
    ctx.moveTo(a.l - s.w * 7, a.yb); ctx.lineTo(a.l - s.w * 3, mid); ctx.lineTo(a.l - s.w * 0.8, top);
    ctx.lineTo(a.r + s.w * 0.8, top); ctx.lineTo(a.r + s.w * 3, mid); ctx.lineTo(a.r + s.w * 7, a.yb); ctx.closePath();
    ctx.moveTo(a.l, a.yb); ctx.lineTo(a.r, a.yb); ctx.lineTo(a.r, a.yt); ctx.lineTo(a.l, a.yt); ctx.closePath();
    ctx.fill('evenodd');
    ctx.strokeStyle = '#d0c7b8'; ctx.lineWidth = Math.max(1, s.w * 0.04); ctx.strokeRect(a.l, a.yt, a.r - a.l, a.yb - a.yt);
    if (T.weather === 'snow') poly(a.l - s.w * 0.8, top, a.r + s.w * 0.8, top, a.r + s.w * 1.6, top + (mid - top) * 0.4, a.l - s.w * 1.6, top + (mid - top) * 0.4, '#ffffff');
  }
}

function ridge(off, baseY, amp, color, seed, flat) {
  const step = 8;
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W + step; x += step) {
    const t = x + off;
    let h = 0.55 + 0.25 * Math.sin(t * 0.011 + seed) + 0.13 * Math.sin(t * 0.027 + seed * 2) + 0.07 * Math.sin(t * 0.061 + seed * 3);
    if (flat) h = h > 0.6 ? 0.85 : h * 0.4;
    ctx.lineTo(x, baseY - amp * h);
  }
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
}
function skyline(off, baseY, color, seed, lit) {
  const bw = 46;
  const start = Math.floor(off / bw) - 1;
  for (let i = start; i < start + W / bw + 3; i++) {
    const r = Math.abs(Math.sin(i * 12.9898 + seed) * 43758.5453) % 1;
    const h = 30 + r * 110, x = i * bw - off;
    ctx.fillStyle = color; ctx.fillRect(x, baseY - h, bw - 4, h + 200);
    if (lit) {
      ctx.fillStyle = r > 0.5 ? 'rgba(255,220,140,0.55)' : 'rgba(150,220,255,0.45)';
      for (let y = baseY - h + 8; y < baseY - 6; y += 12) for (let k = 0; k < 3; k++) {
        if (((i * 7 + y * 3 + k) % 5) < 2) ctx.fillRect(x + 6 + k * 12, y, 5, 5);
      }
    }
  }
}
const STARS = Array.from({ length: 70 }, (_, i) => [(Math.sin(i * 91.7) * 0.5 + 0.5) * W, (Math.sin(i * 47.3) * 0.5 + 0.5) * H * 0.45, i % 3 ? 1 : 2]);

function drawBackground(playerY) {
  const g = ctx.createLinearGradient(0, 0, 0, H * 0.6);
  g.addColorStop(0, T.sky[0]); g.addColorStop(1, T.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (T.night) { ctx.fillStyle = '#fff'; for (const [x, y, s] of STARS) ctx.fillRect((x - skyOff * 100 % W + W) % W, y, s, s); }
  const shift = U.clamp(playerY * 0.004, -40, 40);
  if (T.sun) {
    const sx = ((T.sun.x * W - skyOff * 200) % W + W) % W, sy = T.sun.y * H + (T.bg === 'sea' ? shift * 0.3 : 0);
    ctx.fillStyle = T.sun.moon ? 'rgba(255,255,230,0.12)' : 'rgba(255,245,200,0.3)'; circle(sx, sy, T.sun.r * 1.6);
    ctx.fillStyle = T.sun.color; circle(sx, sy, T.sun.r);
    if (T.sun.moon) { ctx.fillStyle = T.sky[0]; circle(sx + T.sun.r * 0.45, sy - T.sun.r * 0.2, T.sun.r * 0.85); }
  }
  const off1 = skyOff * W * 2, off2 = hillOff * W * 2;
  if (T.bg === 'mountains') {
    ridge(off1, H * 0.52 + shift * 0.5, 120, T.far, 1.3);
    if (T.weather === 'snow') ridge(off1, H * 0.52 + shift * 0.5 - 70, 50, '#ffffff', 1.3);
    ridge(off2, H * 0.56 + shift, 70, T.near, 4.1);
  } else if (T.bg === 'mesas') {
    ridge(off1, H * 0.53 + shift * 0.5, 110, T.far, 2.2, true);
    ridge(off2, H * 0.56 + shift, 40, T.near, 5.3);
  } else if (T.bg === 'sea') {
    const hy = H * 0.5 + shift * 0.5;
    ctx.fillStyle = T.far; ctx.fillRect(0, hy, W, H - hy);
    ctx.fillStyle = 'rgba(255,220,150,0.5)';
    for (let i = 0; i < 14; i++) { const y = hy + 4 + i * 6, w = 70 - i * 3; ctx.fillRect(((T.sun.x * W - skyOff * 200) % W + W) % W - w / 2 + Math.sin(performance.now() / 300 + i) * 6, y, w, 2); }
    ridge(off2, H * 0.57 + shift, 30, T.near, 3.7);
  } else if (T.bg === 'skyline') {
    skyline(off1 * 0.5, H * 0.52 + shift * 0.5, T.far, 3, false);
    skyline(off2 * 0.5, H * 0.56 + shift, T.near, 7, true);
  }
}

function drawCar(cx, by, w, col, steer, brake, isPlayer) {
  if (w < 2) return;
  const h = w * 0.52, x = cx - w / 2, s = steer * w * 0.04;
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(cx, by - h * 0.02, w * 0.56, h * 0.1, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#141414';
  ctx.fillRect(x + w * 0.02, by - h * 0.34, w * 0.18, h * 0.34);
  ctx.fillRect(x + w * 0.8, by - h * 0.34, w * 0.18, h * 0.34);
  poly(x + w * 0.14, by - h * 0.7, x + w * 0.86, by - h * 0.7, x + w * 0.74 + s, by - h, x + w * 0.26 + s, by - h, col[1]);
  poly(x + w * 0.21, by - h * 0.72, x + w * 0.79, by - h * 0.72, x + w * 0.7 + s, by - h * 0.94, x + w * 0.3 + s, by - h * 0.94, '#22303d');
  poly(x + w * 0.27 + s, by - h * 0.9, x + w * 0.4 + s, by - h * 0.9, x + w * 0.33, by - h * 0.75, x + w * 0.24, by - h * 0.75, 'rgba(255,255,255,0.18)');
  ctx.fillStyle = col[0]; ctx.fillRect(x, by - h * 0.72, w, h * 0.46);
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(x, by - h * 0.72, w, h * 0.06);
  ctx.fillStyle = col[1]; ctx.fillRect(x - w * 0.02, by - h * 0.8, w * 1.04, h * 0.07);
  ctx.fillRect(x + w * 0.1, by - h * 0.76, w * 0.04, h * 0.06); ctx.fillRect(x + w * 0.86, by - h * 0.76, w * 0.04, h * 0.06);
  if (isPlayer) { ctx.fillStyle = '#fff'; ctx.fillRect(cx - w * 0.09, by - h * 0.72, w * 0.05, h * 0.46); ctx.fillRect(cx + w * 0.04, by - h * 0.72, w * 0.05, h * 0.46); }
  if (brake) { ctx.fillStyle = 'rgba(255,40,40,0.35)'; ctx.fillRect(x - w * 0.02, by - h * 0.66, w * 0.3, h * 0.24); ctx.fillRect(x + w * 0.72, by - h * 0.66, w * 0.3, h * 0.24); }
  ctx.fillStyle = brake || T.night ? '#ff4040' : '#a01010';
  ctx.fillRect(x + w * 0.04, by - h * 0.62, w * 0.2, h * 0.14); ctx.fillRect(x + w * 0.76, by - h * 0.62, w * 0.2, h * 0.14);
  ctx.fillStyle = '#f5f5f5'; ctx.fillRect(cx - w * 0.1, by - h * 0.5, w * 0.2, h * 0.11);
  ctx.fillStyle = '#222'; ctx.fillRect(x + w * 0.06, by - h * 0.3, w * 0.88, h * 0.06);
  ctx.fillStyle = '#888'; ctx.fillRect(x + w * 0.66, by - h * 0.27, w * 0.08, h * 0.06);
  const lr = w * (brake ? 0.22 : 0.15);
  addLight(x + w * 0.14, by - h * 0.55, lr, 'rgba(255,40,40,0.5)');
  addLight(x + w * 0.86, by - h * 0.55, lr, 'rgba(255,40,40,0.5)');
}

function drawNitroFlame(cx, by, w) {
  const h = w * 0.52;
  for (const ex of [-0.28, 0.28]) {
    const x = cx + ex * w, y = by - h * 0.27, len = h * (0.35 + Math.random() * 0.3);
    poly(x - w * 0.05, y, x + w * 0.05, y, x, y + len, '#ff8f00');
    poly(x - w * 0.025, y, x + w * 0.025, y, x, y + len * 0.6, '#fff59d');
  }
}

function withClip(clipY, fn) {
  if (clipY >= H) { fn(); return; }
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, clipY); ctx.clip(); fn(); ctx.restore();
}

function drawSprite(sp, sx, sy, scale, clipY) {
  const def = SP[sp.type];
  const w = def.w * (sp.s || 1) * scale * W / 2, h = def.h * (sp.hs || sp.s || 1) * scale * W / 2;
  if (w < 1 || sy - h >= clipY) return;
  const cx = sp.type === 'arch' ? sx : sx + Math.sign(sp.offset) * w / 2;
  if (cx + w < -50 || cx - w > W + 50) return;
  withClip(clipY, () => def.draw(cx, sy, w, h, sp));
}

function drawPlayer(playerSeg, playerPct) {
  const camY = U.interp(playerSeg.p1.camera.y, playerSeg.p2.camera.y, playerPct);
  const pct = speed / MAXSPEED;
  const bounce = (Math.random() * 2 - 1) * pct * (Math.abs(playerX) > 1 && !inPit ? 4 : 1.5);
  const y = H / 2 - (camDepth / playerZ) * camY * H / 2 + bounce;
  const w = CARW * (camDepth / playerZ) * W / 2;
  let steer = 0;
  if (speed > 0 && state === 'race') steer = keys.left ? -1 : keys.right ? 1 : 0;
  if (nitroT > 0) drawNitroFlame(W / 2, y, w);
  drawCar(W / 2, y, w, PLAYER_COLOR, steer, braking, true);
}

function drawLights() {
  if (!T.night && !lights.length) return;
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < lights.length; i += 4) {
    const x = lights[i], y = lights[i + 1], r = lights[i + 2];
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, lights[i + 3]); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  ctx.globalCompositeOperation = 'source-over';
}

function render() {
  const L = trackLength;
  const baseSeg = findSegment(position), basePct = U.pctRem(position, SEG);
  const playerSeg = findSegment(position + playerZ), playerPct = U.pctRem(position + playerZ, SEG);
  const playerY = U.interp(playerSeg.p1.world.y, playerSeg.p2.world.y, playerPct);
  lights = [];

  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * 12, (Math.random() - 0.5) * 8);
  drawBackground(playerY);

  let maxy = H, x = 0, dx = -(baseSeg.curve * basePct);
  for (let n = 0; n < DRAW; n++) {
    const seg = segments[(baseSeg.index + n) % segments.length];
    seg.looped = seg.index < baseSeg.index;
    seg.fog = Math.exp(-((n / DRAW) ** 2) * T.fogDensity);
    seg.clip = maxy;
    const camZ = position - (seg.looped ? L : 0);
    project(seg.p1, playerX * ROADW - x, playerY + CAMH, camZ);
    project(seg.p2, playerX * ROADW - x - dx, playerY + CAMH, camZ);
    x += dx; dx += seg.curve;
    if (seg.p1.camera.z <= camDepth || seg.p2.screen.y >= seg.p1.screen.y || seg.p2.screen.y >= maxy) continue;
    drawSegment(seg);
    maxy = seg.p1.screen.y;
  }

  for (let n = DRAW - 1; n > 0; n--) {
    const seg = segments[(baseSeg.index + n) % segments.length];
    if (seg.tunnel && seg.p1.camera.z > camDepth) withClip(seg.clip, () => drawTunnel(seg));
    for (const sp of seg.sprites) {
      const scale = seg.p1.screen.scale;
      drawSprite(sp, seg.p1.screen.x + scale * sp.offset * ROADW * W / 2, seg.p1.screen.y, scale, seg.clip);
    }
    for (const car of seg.cars) {
      const scale = U.interp(seg.p1.screen.scale, seg.p2.screen.scale, car.percent);
      const cx = U.interp(seg.p1.screen.x, seg.p2.screen.x, car.percent) + scale * car.offset * ROADW * W / 2;
      const cy = U.interp(seg.p1.screen.y, seg.p2.screen.y, car.percent);
      const w = CARW * scale * W / 2;
      if (cy - w * 0.52 < seg.clip && cx > -w && cx < W + w) withClip(seg.clip, () => drawCar(cx, cy, w, car.color, 0, false, false));
    }
    if (seg === playerSeg) drawPlayer(playerSeg, playerPct);
  }

  if (T.night) {
    ctx.fillStyle = 'rgba(5,5,25,0.38)'; ctx.fillRect(0, 0, W, H);
    // faróis do jogador
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createLinearGradient(0, H * 0.82, 0, H * 0.52);
    g.addColorStop(0, 'rgba(255,240,190,0.22)'); g.addColorStop(1, 'rgba(255,240,190,0)');
    poly(W / 2 - 150, H * 0.82, W / 2 + 150, H * 0.82, W / 2 + 330, H * 0.54, W / 2 - 330, H * 0.54, g);
    ctx.globalCompositeOperation = 'source-over';
  }
  drawLights();
  drawParticles();
  drawWeather();
  if (nitroT > 0 && state === 'race') { // linhas de velocidade
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2; ctx.beginPath();
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2, r0 = 260 + Math.random() * 120;
      ctx.moveTo(W / 2 + Math.cos(a) * r0, H / 2 + Math.sin(a) * r0 * 0.6);
      ctx.lineTo(W / 2 + Math.cos(a) * (r0 + 160), H / 2 + Math.sin(a) * (r0 + 160) * 0.6);
    }
    ctx.stroke();
  }
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${U.clamp(flash * 2.5, 0, 0.6)})`; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
}

// ================================================================ HUD
function text(str, x, y, size, color = '#fff', align = 'left', maxW) {
  ctx.font = `bold ${size}px "Trebuchet MS", system-ui, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillText(str, x + 2, y + 2, maxW);
  ctx.fillStyle = color; ctx.fillText(str, x, y, maxW);
}
function bar(x, y, w, h, v, color, label) {
  ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * U.clamp(v, 0, 1), h);
  if (label) text(label, x, y - 15, 12, '#ddd');
}

function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(0, 0, W, 66);
  text(`VOLTA ${U.clamp(lap, 1, LAPS)}/${LAPS}`, 14, 6, 22, '#ffeb3b');
  text(`${fmt(playerFinish != null ? playerFinish : raceTime)}`, 14, 34, 18);
  text(`melhor ${fmt(bestLap)}`, 112, 38, 13, '#b2ebf2');

  // combustível / dano
  const fx = 228;
  bar(fx, 22, 120, 9, fuel / 100, fuel < 20 ? (Math.floor(performance.now() / 250) % 2 ? '#ff1744' : '#ff8a80') : '#ffca28', 'COMBUSTÍVEL');
  bar(fx, 50, 120, 9, damage / 100, damage > 60 ? '#ff5252' : '#90a4ae', 'DANO');

  // velocímetro, marcha e giro
  const kmh = Math.round(speed / MAXSPEED * KMH);
  text(`${kmh}`, 470, 2, 38, nitroT > 0 ? '#ffab40' : '#fff', 'right');
  text('km/h', 474, 22, 14, '#ddd');
  ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(520, 6, 34, 40);
  text(String(gear), 537, 9, 30, opts.manual ? '#80d8ff' : '#fff', 'center');
  text(opts.manual ? 'MAN' : 'AUTO', 537, 48, 11, '#bbb', 'center');
  const rx = 390, rw = 120;
  for (let i = 0; i < 12; i++) {
    const on = rpm * 12 > i;
    ctx.fillStyle = on ? (i >= 10 ? '#ff1744' : i >= 8 ? '#ffc400' : '#66bb6a') : 'rgba(255,255,255,0.15)';
    ctx.fillRect(rx + i * (rw / 12), 48, rw / 12 - 2, 10);
  }

  // nitro
  const nmax = 2 + lvl('nitro');
  text('NITRO', 572, 6, 12, '#ffab40');
  for (let i = 0; i < nmax; i++) {
    ctx.fillStyle = i < nitros ? '#ff6d00' : 'rgba(255,255,255,0.2)';
    ctx.fillRect(572 + i * 18, 24, 13, 20);
  }
  if (nitroT > 0) { ctx.fillStyle = '#ffab40'; ctx.fillRect(572, 50, 70 * nitroT / NITRO_TIME, 6); }

  // posição
  const pos = playerFinish != null && results ? results.pos : currentPosition();
  const px = IS_TOUCH ? W - 76 : W - 50;
  text(`${pos}º`, px, 2, 46, pos === 1 ? '#ffd54f' : '#fff', 'right');
  text(`/${cars.length + 1}`, px + 4, 26, 20, '#ddd');

  // barra de progresso da volta com todos os carros
  const bx = 300, bw = 360, by = 76;
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(bx - 6, by - 6, bw + 12, 12);
  ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fillRect(bx, by - 1, bw, 2);
  for (const c of cars) { ctx.fillStyle = c.color[0]; circle(bx + bw * U.clamp(c.z / trackLength, 0, 1), by, 4); }
  ctx.fillStyle = '#fff'; circle(bx + bw * playerCarZ() / trackLength, by, 6);
  ctx.fillStyle = PLAYER_COLOR[0]; circle(bx + bw * playerCarZ() / trackLength, by, 4);
  ctx.fillStyle = 'rgba(80,160,255,0.8)'; ctx.fillRect(bx + bw * PIT_START / segments.length, by + 3, bw * (PIT_END - PIT_START) / segments.length, 3);

  if (msgT > 0 && (state === 'race' || state === 'finished')) text(msg, W / 2, H * 0.24, msg.length > 18 ? 30 : 44, '#ffeb3b', 'center', W - 40);
  if (state === 'finished') text('CHEGADA!', W / 2, H * 0.32, 60, '#fff', 'center');
}

// ================================================================ telas
function panel(x, y, w, h) {
  ctx.fillStyle = 'rgba(8,12,28,0.82)'; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#ffeb3b'; ctx.lineWidth = 3; ctx.strokeRect(x, y, w, h);
}
function dim(a = 0.45) { ctx.fillStyle = `rgba(0,0,0,${a})`; ctx.fillRect(0, 0, W, H); }

let confirmNew = false;
function screenTitle() {
  dim(0.3);
  text('TURBO ESTRADA', W / 2, 52, 76, '#ffeb3b', 'center');
  text('Campeonato de 6 pistas  •  oficina  •  boxes  •  câmbio', W / 2, 138, 20, '#fff', 'center');
  let y = 190;
  if (career && career.race < THEMES.length) {
    button(`CONTINUAR  —  corrida ${career.race + 1}/6  •  ${money(career.money)}`, W / 2 - 250, y, 500, 58, () => { setupTrack(career.race); resetRace(); goto('garage'); }, { primary: true, size: 20 });
    y += 72;
  }
  button(confirmNew ? 'TOQUE DE NOVO: APAGAR PROGRESSO?' : 'NOVO CAMPEONATO', W / 2 - 250, y, 500, 58, () => {
    if (career && career.race > 0 && career.race < THEMES.length && !confirmNew) { confirmNew = true; return; }
    confirmNew = false; newCareer(); setupTrack(0); resetRace(); goto('garage');
  }, { primary: !career || career.race >= THEMES.length });
  y += 72;
  button('OPÇÕES', W / 2 - 250, y, 500, 58, () => { optionsBack = 'title'; goto('options'); });
  const hint = IS_TOUCH ? 'Toque nos botões' : 'Setas + Enter para escolher  •  na pista: setas, ESPAÇO nitro, Q/E marchas, P pausa';
  text(hint, W / 2, H - 34, 15, '#cfd8dc', 'center');
}

let optionsBack = 'title';
function screenOptions() {
  dim(0.55);
  text('OPÇÕES', W / 2, 40, 48, '#ffeb3b', 'center');
  const bx = W / 2 - 260, bw = 520, bh = 56;
  const rows = [
    [`Dificuldade: ${DIFFS[opts.diff].name}`, () => { opts.diff = (opts.diff + 1) % DIFFS.length; }],
    [`Câmbio: ${opts.manual ? 'Manual (+8% aceleração)' : 'Automático'}`, () => { opts.manual = !opts.manual; }],
    [`Acelerador: ${opts.autoGas ? 'Automático (segure ▼ para frear)' : 'Manual (segure ▲)'}`, () => { opts.autoGas = !opts.autoGas; }],
    [`Som: ${opts.sound ? 'Ligado' : 'Desligado'}`, () => { opts.sound = !opts.sound; }],
  ];
  rows.forEach(([label, fn], i) => button(label, bx, 112 + i * 70, bw, bh, () => { fn(); saveOpts(); }, { size: 19 }));
  button('VOLTAR', bx, 112 + rows.length * 70 + 10, bw, bh, () => goto(optionsBack), { primary: true });
}

function screenGarage() {
  dim(0.6);
  const t = THEMES[career.race];
  text('OFICINA', 24, 14, 36, '#ffeb3b');
  text(money(career.money), W - 24, 16, 32, '#69f0ae', 'right');
  text(`Próxima: ${career.race + 1}/6 — ${t.name}`, 24, 56, 19, '#fff');
  text(t.desc, 24, 78, 14, '#cfd8dc');
  UPGRADES.forEach((u, i) => {
    const x = 24 + (i % 2) * 312, y = 104 + Math.floor(i / 2) * 114, w = 300, h = 104;
    panel(x, y, w, h);
    const lv = career.up[u.id];
    text(u.name, x + 12, y + 8, 21, '#fff');
    for (let k = 0; k < 3; k++) { ctx.fillStyle = k < lv ? '#ffeb3b' : 'rgba(255,255,255,0.2)'; ctx.fillRect(x + w - 70 + k * 20, y + 12, 14, 16); }
    text(u.desc, x + 12, y + 36, 13, '#cfd8dc', 'left', w - 24);
    const max = lv >= 3, cost = max ? 0 : u.cost[lv];
    button(max ? 'NÍVEL MÁXIMO' : `Comprar nível ${lv + 1}  ${money(cost)}`, x + 12, y + 58, w - 24, 38, () => {
      career.money -= cost; career.up[u.id]++; saveCareer(); beep(990, 0.12, 0.06, 'triangle');
    }, { disabled: max || career.money < cost, size: 16 });
  });
  const sx = 652, sw = 284;
  panel(sx, 104, sw, 332);
  text('CAMPEONATO', sx + sw / 2, 112, 18, '#ffeb3b', 'center');
  standingsList().forEach((e, i) => {
    const y = 142 + i * 36;
    ctx.fillStyle = e.color[0]; ctx.fillRect(sx + 14, y + 4, 14, 14);
    text(`${i + 1}º ${e.name}`, sx + 36, y, 17, e.me ? '#ffeb3b' : '#fff');
    text(`${e.pts}`, sx + sw - 14, y, 17, e.me ? '#ffeb3b' : '#fff', 'right');
  });
  button('CORRER ▶', sx, 450, sw, 70, startRace, { primary: true, size: 26 });
  button('MENU', 24, 450, 140, 70, () => goto('title'));
  button('OPÇÕES', 176, 450, 140, 70, () => { optionsBack = 'garage'; goto('options'); });
  text(`Pontos: ${POINTS.slice(0, 3).join('/')}/...  •  1º lugar ganha ${money(PRIZE[0])} + ${money(1000)} de bônus`, 336, 486, 13, '#cfd8dc', 'left', 300);
}

function screenResults() {
  dim(0.6);
  const r = results;
  panel(W / 2 - 330, 24, 660, 492);
  text(r.pos === 1 ? 'VITÓRIA!' : `${r.pos}º LUGAR`, W / 2, 36, 44, '#ffeb3b', 'center');
  text(`${r.track}  •  corrida ${career.race + 1}/6`, W / 2, 86, 17, '#cfd8dc', 'center');
  r.list.forEach((e, i) => {
    const y = 116 + i * 34;
    if (e.me) { ctx.fillStyle = 'rgba(255,235,59,0.15)'; ctx.fillRect(W / 2 - 310, y - 4, 620, 32); }
    text(`${i + 1}º`, W / 2 - 296, y, 20, e.me ? '#ffeb3b' : '#fff');
    ctx.fillStyle = e.color[0]; ctx.fillRect(W / 2 - 248, y + 4, 16, 16);
    text(e.name, W / 2 - 222, y, 20, e.me ? '#ffeb3b' : '#fff');
    text(fmt(e.time) + (e.est ? '*' : ''), W / 2 + 120, y, 18, '#e0e0e0', 'right');
    text(`+${e.pts} pts`, W / 2 + 290, y, 18, '#80d8ff', 'right');
  });
  text(`Prêmio: ${money(r.prize)}${r.bonus ? `  +  bônus de vitória ${money(r.bonus)}` : ''}  •  melhor volta ${fmt(bestLap)}`, W / 2, 392, 17, '#69f0ae', 'center');
  text('* tempo estimado (ainda na pista)', W / 2, 416, 12, '#90a4ae', 'center');
  button(career.race + 1 >= THEMES.length ? 'VER RESULTADO FINAL ▶' : 'IR PARA A OFICINA ▶', W / 2 - 200, 444, 400, 58, afterResults, { primary: true, size: 22 });
}

function screenChampion() {
  dim(0.6);
  const list = standingsList(), pos = list.findIndex(e => e.me) + 1;
  panel(W / 2 - 300, 24, 600, 492);
  text(pos === 1 ? 'CAMPEÃO!' : 'FIM DO CAMPEONATO', W / 2, 38, 48, '#ffeb3b', 'center');
  text(pos === 1 ? 'Você venceu o campeonato Turbo Estrada!' : `Você terminou em ${pos}º lugar.`, W / 2, 96, 19, '#fff', 'center');
  list.forEach((e, i) => {
    const y = 136 + i * 34;
    ctx.fillStyle = e.color[0]; ctx.fillRect(W / 2 - 200, y + 4, 16, 16);
    text(`${i + 1}º  ${e.name}`, W / 2 - 174, y, 20, e.me ? '#ffeb3b' : '#fff');
    text(`${e.pts} pts`, W / 2 + 200, y, 20, e.me ? '#ffeb3b' : '#fff', 'right');
  });
  button('NOVO CAMPEONATO', W / 2 - 260, 430, 250, 60, () => { newCareer(); setupTrack(0); resetRace(); goto('garage'); }, { primary: true });
  button('MENU', W / 2 + 10, 430, 250, 60, () => { career = null; saveCareer(); setupTrack(0); resetRace(); goto('title'); });
}

function screenPause() {
  dim(0.5);
  panel(W / 2 - 220, 110, 440, 320);
  text('PAUSA', W / 2, 126, 44, '#ffeb3b', 'center');
  button('CONTINUAR', W / 2 - 180, 192, 360, 60, () => { paused = false; }, { primary: true });
  button('REINICIAR CORRIDA', W / 2 - 180, 266, 360, 60, startRace);
  button('DESISTIR (VOLTAR À OFICINA)', W / 2 - 180, 340, 360, 60, () => { resetRace(); goto('garage'); }, { size: 18 });
}

function drawScreens() {
  uiButtons = [];
  if (paused) screenPause();
  else if (state === 'title') screenTitle();
  else if (state === 'options') screenOptions();
  else if (state === 'garage') screenGarage();
  else if (state === 'results') screenResults();
  else if (state === 'champion') screenChampion();
  else if (state === 'countdown') {
    text(T.name, W / 2, H * 0.17, 40, '#fff', 'center');
    text(`Corrida ${career.race + 1}/6  •  ${LAPS} voltas`, W / 2, H * 0.17 + 48, 18, '#e0e0e0', 'center');
    const c = Math.ceil(countdown);
    if (c <= 3) text(String(c), W / 2, H * 0.36, 110, c === 1 ? '#ffeb3b' : '#ff5252', 'center');
  }
  if (uiFocus >= uiButtons.length) uiFocus = 0;
}

// ================================================================ loop
setupTrack(career && career.race < THEMES.length ? career.race : 0);
resetRace();
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.25, (now - last) / 1000);
  last = now;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  render();
  if (state === 'race' || state === 'countdown' || state === 'finished') drawHUD();
  drawScreens();
  syncBodyFlags();
  updateAudio();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
