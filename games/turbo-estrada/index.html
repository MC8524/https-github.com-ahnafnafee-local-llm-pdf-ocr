<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Turbo Estrada</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; font-family: system-ui, sans-serif; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { width: 100%; max-width: calc(100vh * 16 / 9); aspect-ratio: 16 / 9; background: #000; }
  #touch { position: fixed; left: 0; right: 0; bottom: 0; display: none; justify-content: space-between; padding: 14px; pointer-events: none; }
  #touch .grp { display: flex; gap: 12px; pointer-events: auto; }
  #touch button {
    width: 74px; height: 74px; border-radius: 50%; border: 2px solid rgba(255,255,255,.55);
    background: rgba(0,0,0,.35); color: #fff; font-size: 24px; font-weight: 700;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  #touch button.on { background: rgba(255,255,255,.3); }
  @media (pointer: coarse) { #touch { display: flex; } }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="grp">
    <button data-k="left">◀</button>
    <button data-k="right">▶</button>
  </div>
  <div class="grp">
    <button data-k="nitro">N</button>
    <button data-k="down">▼</button>
    <button data-k="up">▲</button>
  </div>
</div>
<script>
'use strict';
// Turbo Estrada — corrida pseudo-3D (estrada por segmentos projetados), sem assets externos.

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 960, H = 540;
canvas.width = W; canvas.height = H;

// ---------------------------------------------------------------- constantes
const STEP = 1 / 60;
const SEG = 200, RUMBLE = 3, ROADW = 2000, LANES = 3;
const FOV = 100, CAMH = 1000, DRAW = 300, FOG = 5;
const camDepth = 1 / Math.tan((FOV / 2) * Math.PI / 180);
const playerZ = CAMH * camDepth;
const MAXSPEED = SEG / STEP;
const ACCEL = MAXSPEED / 5, BRAKE = -MAXSPEED, DECEL = -MAXSPEED / 5;
const OFF_DECEL = -MAXSPEED / 2, OFF_LIMIT = MAXSPEED / 4, CENTRIFUGAL = 0.3;
const CARW = 560, CAR_COLLIDE = CARW / ROADW;
const LAPS = 3;
const NITRO_COUNT = 3, NITRO_TIME = 2.5, NITRO_BOOST = 1.35;

const COLORS = {
  fog: '#b5dcf3',
  light: { road: '#6b6b6b', grass: '#3fa34d', rumble: '#efefef', lane: '#efefef' },
  dark:  { road: '#646464', grass: '#37923f', rumble: '#c8202a' },
};
const PLAYER_COLOR = ['#d32f2f', '#7f1414'];
const RIVALS = [
  { name: 'Raio',    color: ['#1e88e5', '#0d47a1'] },
  { name: 'Faísca',  color: ['#fdd835', '#9e8400'] },
  { name: 'Trovão',  color: ['#43a047', '#1b5e20'] },
  { name: 'Cometa',  color: ['#8e24aa', '#4a148c'] },
  { name: 'Vulcão',  color: ['#fb8c00', '#9a5000'] },
  { name: 'Tufão',   color: ['#00acc1', '#005f6b'] },
  { name: 'Ciclone', color: ['#eceff1', '#8a9aa3'] },
];
const SIGN_TEXTS = ['TURBO', 'PISA FUNDO', 'NITRO', 'VAI!', 'CURVAS', 'ACELERA'];

// ---------------------------------------------------------------- utilidades
const U = {
  clamp: (v, a, b) => Math.max(a, Math.min(b, v)),
  interp: (a, b, p) => a + (b - a) * p,
  easeIn: (a, b, p) => a + (b - a) * p * p,
  easeInOut: (a, b, p) => a + (b - a) * (-Math.cos(p * Math.PI) / 2 + 0.5),
  pctRem: (n, total) => (n % total) / total,
  increase(start, inc, max) {
    let r = start + inc;
    while (r >= max) r -= max;
    while (r < 0) r += max;
    return r;
  },
  overlap(x1, w1, x2, w2, pct) {
    const h = (pct || 1) / 2;
    return !((x1 + w1 * h) < (x2 - w2 * h) || (x1 - w1 * h) > (x2 + w2 * h));
  },
  rand: (a, b) => a + Math.random() * (b - a),
};
function seeded(seed) { // mulberry32 — cenário igual a cada corrida
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function fmt(t) {
  if (t == null) return '--:--.--';
  const m = Math.floor(t / 60), s = t - m * 60;
  return `${m}:${s < 10 ? '0' : ''}${s.toFixed(2)}`;
}

// ---------------------------------------------------------------- pista
let segments = [], trackLength = 0;

function lastY() { return segments.length ? segments[segments.length - 1].p2.world.y : 0; }
function findSegment(z) { return segments[Math.floor(z / SEG) % segments.length]; }

function addSegment(curve, y) {
  const n = segments.length;
  segments.push({
    index: n,
    p1: { world: { y: lastY(), z: n * SEG }, camera: {}, screen: {} },
    p2: { world: { y, z: (n + 1) * SEG }, camera: {}, screen: {} },
    curve, sprites: [], cars: [],
    color: Math.floor(n / RUMBLE) % 2 ? COLORS.dark : COLORS.light,
  });
}

function addRoad(enter, hold, leave, curve, height) {
  const sy = lastY(), ey = sy + height * SEG, total = enter + hold + leave;
  for (let n = 0; n < enter; n++) addSegment(U.easeIn(0, curve, n / enter), U.easeInOut(sy, ey, n / total));
  for (let n = 0; n < hold; n++)  addSegment(curve, U.easeInOut(sy, ey, (enter + n) / total));
  for (let n = 0; n < leave; n++) addSegment(U.easeInOut(curve, 0, n / leave), U.easeInOut(sy, ey, (enter + hold + n) / total));
}

const LEN = { S: 25, M: 50, L: 100 }, CURVE = { E: 2, M: 4, H: 6 }, HILL = { L: 20, M: 40, H: 60 };

function buildTrack() {
  segments = [];
  addRoad(LEN.S, LEN.M, LEN.S, 0, 0);                  // reta de largada
  addRoad(LEN.M, LEN.M, LEN.M, 0, HILL.L);             // subida leve
  addRoad(LEN.M, LEN.M, LEN.M, CURVE.M, 0);            // curva à direita
  addRoad(LEN.S, LEN.M, LEN.S, -CURVE.E, HILL.M);
  addRoad(LEN.M, LEN.L, LEN.M, CURVE.E, -HILL.M);      // descida longa
  // sequência de S
  addRoad(LEN.M, LEN.M, LEN.M, -CURVE.E, 0);
  addRoad(LEN.M, LEN.M, LEN.M, CURVE.M, HILL.M);
  addRoad(LEN.M, LEN.M, LEN.M, CURVE.E, -HILL.L);
  addRoad(LEN.M, LEN.M, LEN.M, -CURVE.E, HILL.M);
  addRoad(LEN.M, LEN.M, LEN.M, -CURVE.M, -HILL.M);
  // lombadas
  for (const h of [5, -2, -5, 8, 5, -7, 5, -2]) addRoad(10, 10, 10, 0, h);
  addRoad(LEN.L, LEN.M, LEN.L, -CURVE.H, HILL.H);      // grampo em subida
  addRoad(LEN.M, LEN.M, LEN.M, CURVE.H, -HILL.M);
  addRoad(LEN.L, LEN.L, LEN.L, 0, 0);                  // retão
  addRoad(LEN.M, LEN.S, LEN.M, -CURVE.M, HILL.L);
  addRoad(LEN.M, LEN.M, LEN.M, CURVE.M, -HILL.L);
  addRoad(LEN.L, LEN.L, LEN.L, -CURVE.E, -lastY() / SEG); // volta ao nível zero
  trackLength = segments.length * SEG;
  placeSprites();
}

// ---------------------------------------------------------------- cenário
function addSprite(n, type, offset, extra) {
  if (segments[n]) segments[n].sprites.push(Object.assign({ type, offset }, extra));
}

function placeSprites() {
  const rnd = seeded(1987);
  const side = () => (rnd() < 0.5 ? -1 : 1);
  const pick = a => a[Math.floor(rnd() * a.length)];
  segments[0].checker = segments[1].checker = true;
  addSprite(0, 'arch', 0);
  for (let n = 20; n < segments.length - 5; n += 3) {
    if (rnd() < 0.55) addSprite(n, pick(['tree', 'tree', 'pine', 'bush']), side() * (1.35 + rnd() * 3));
    if (rnd() < 0.25) addSprite(n, pick(['tree', 'pine']), side() * (2.5 + rnd() * 3.5));
  }
  for (let n = 10; n < segments.length; n += 12) { addSprite(n, 'post', -1.12); addSprite(n, 'post', 1.12); }
  for (let n = 40, i = 0; n < segments.length; n += 160, i++) addSprite(n, 'sign', side() * 1.25, { text: SIGN_TEXTS[i % SIGN_TEXTS.length] });
  for (let n = 0; n < segments.length; n += 8) {
    const c = segments[n].curve;
    if (Math.abs(c) >= 3.5) addSprite(n, 'chevron', c > 0 ? -1.25 : 1.25, { dir: c > 0 ? 1 : -1 });
  }
}

function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function poly(...pts) {
  const color = pts.pop();
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath(); ctx.fill();
}

// w/h em unidades de mundo; hit = fração da largura que colide (0 = atravessável)
const SP = {
  tree: { w: 900, h: 1500, hit: 0.45, draw(cx, by, w, h) {
    ctx.fillStyle = '#6b4423'; ctx.fillRect(cx - w * 0.07, by - h * 0.42, w * 0.14, h * 0.42);
    ctx.fillStyle = '#2e7d32';
    circle(cx, by - h * 0.64, w * 0.4); circle(cx - w * 0.24, by - h * 0.5, w * 0.27); circle(cx + w * 0.24, by - h * 0.5, w * 0.27);
    ctx.fillStyle = '#43a047'; circle(cx - w * 0.1, by - h * 0.72, w * 0.17);
  } },
  pine: { w: 700, h: 1700, hit: 0.35, draw(cx, by, w, h) {
    ctx.fillStyle = '#5d3a1a'; ctx.fillRect(cx - w * 0.06, by - h * 0.2, w * 0.12, h * 0.2);
    poly(cx - w / 2, by - h * 0.18, cx + w / 2, by - h * 0.18, cx, by - h * 0.62, '#1b5e20');
    poly(cx - w * 0.4, by - h * 0.45, cx + w * 0.4, by - h * 0.45, cx, by - h * 0.85, '#236b28');
    poly(cx - w * 0.28, by - h * 0.7, cx + w * 0.28, by - h * 0.7, cx, by - h, '#2e7d32');
  } },
  bush: { w: 700, h: 380, hit: 0, draw(cx, by, w, h) {
    ctx.fillStyle = '#2f8a3a'; ctx.beginPath(); ctx.ellipse(cx, by - h * 0.45, w / 2, h * 0.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#46a650'; ctx.beginPath(); ctx.ellipse(cx - w * 0.12, by - h * 0.6, w * 0.22, h * 0.25, 0, 0, Math.PI * 2); ctx.fill();
  } },
  post: { w: 110, h: 420, hit: 1, draw(cx, by, w, h) {
    ctx.fillStyle = '#f2f2f2'; ctx.fillRect(cx - w / 2, by - h, w, h);
    ctx.fillStyle = '#d32f2f'; ctx.fillRect(cx - w / 2, by - h, w, h * 0.22);
  } },
  chevron: { w: 520, h: 640, hit: 0.3, draw(cx, by, w, h, sp) {
    ctx.fillStyle = '#555'; ctx.fillRect(cx - w * 0.05, by - h * 0.5, w * 0.1, h * 0.5);
    ctx.fillStyle = '#ffd400'; ctx.fillRect(cx - w / 2, by - h, w, h * 0.55);
    const d = sp.dir, y0 = by - h * 0.93, y1 = by - h * 0.52, ym = (y0 + y1) / 2;
    for (const k of [-0.22, 0.12]) {
      const x = cx + k * w * d;
      poly(x, y0, x + w * 0.14 * d, y0, x + w * 0.3 * d, ym, x + w * 0.14 * d, y1, x, y1, x + w * 0.16 * d, ym, '#111');
    }
  } },
  sign: { w: 1500, h: 1100, hit: 0.25, draw(cx, by, w, h, sp) {
    ctx.fillStyle = '#444'; ctx.fillRect(cx - w * 0.35, by - h * 0.5, w * 0.05, h * 0.5); ctx.fillRect(cx + w * 0.3, by - h * 0.5, w * 0.05, h * 0.5);
    ctx.fillStyle = '#0d2b5c'; ctx.fillRect(cx - w / 2, by - h, w, h * 0.52);
    ctx.fillStyle = '#ffeb3b'; ctx.fillRect(cx - w / 2, by - h, w, h * 0.05); ctx.fillRect(cx - w / 2, by - h * 0.53, w, h * 0.05);
    if (w > 30) {
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `bold ${Math.max(6, h * 0.2)}px "Trebuchet MS", sans-serif`;
      ctx.fillText(sp.text, cx, by - h * 0.74, w * 0.9);
    }
  } },
  arch: { w: 5400, h: 1900, hit: 0, draw(cx, by, w, h) {
    ctx.fillStyle = '#333';
    ctx.fillRect(cx - w * 0.47, by - h, w * 0.03, h); ctx.fillRect(cx + w * 0.44, by - h, w * 0.03, h);
    const bx = cx - w * 0.47, bw = w * 0.94, bh = h * 0.2, n = 24;
    for (let i = 0; i < n; i++) for (let j = 0; j < 2; j++) {
      ctx.fillStyle = (i + j) % 2 ? '#111' : '#fafafa';
      ctx.fillRect(bx + i * bw / n, by - h + j * bh / 2, bw / n + 1, bh / 2 + 1);
    }
    ctx.fillStyle = '#c62828'; ctx.fillRect(cx - w * 0.2, by - h * 0.98, w * 0.4, h * 0.16);
    if (w > 60) {
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `bold ${Math.max(6, h * 0.11)}px "Trebuchet MS", sans-serif`;
      ctx.fillText('LARGADA / CHEGADA', cx, by - h * 0.9, w * 0.38);
    }
  } },
};

// ---------------------------------------------------------------- estado
let position, playerX, speed, lap, raceTime, lapStart, lastLap, bestLap;
let nitros, nitroT, shake, cars, state = 'menu', paused = false;
let countdown = 0, lastCount = 0, finishPos = 0, finishTime = 0, standings = [];
let msg = '', msgT = 0, skyOff = 0, hillOff = 0, braking = false;

function playerCarZ() { return U.increase(position, playerZ, trackLength); }
function playerProgress() { return lap * trackLength + playerCarZ(); }
function carProgress(c) { return c.lap * trackLength + c.z; }
function currentPosition() {
  const p = playerProgress();
  return 1 + cars.filter(c => carProgress(c) > p).length;
}

function resetRace() {
  buildTrack();
  const z0 = trackLength - SEG * 30; // grid antes da linha
  position = U.increase(z0, -playerZ, trackLength);
  playerX = -0.5; speed = 0; lap = 0;
  raceTime = 0; lapStart = 0; lastLap = null; bestLap = null;
  nitros = NITRO_COUNT; nitroT = 0; shake = 0; msg = ''; msgT = 0;
  cars = RIVALS.map((r, i) => {
    const row = Math.floor((i + 1) / 2);
    const car = {
      name: r.name, color: r.color, lap: 0, speed: 0, percent: 0,
      z: z0 + row * SEG * 5,
      offset: (i + 1) % 2 ? 0.5 : -0.5,
      base: MAXSPEED * (0.8 + row * 0.018 + Math.random() * 0.02),
    };
    findSegment(car.z).cars.push(car);
    return car;
  });
}

// ---------------------------------------------------------------- áudio
let audio = null, muted = false;
function initAudio() {
  if (audio) return;
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
    o.type = 'sawtooth'; f.type = 'lowpass'; f.frequency.value = 800; g.gain.value = 0;
    o.connect(f).connect(g).connect(ac.destination); o.start();
    audio = { ac, o, g };
  } catch (e) { audio = null; }
}
function beep(freq, dur, vol = 0.08, type = 'square') {
  if (!audio || muted) return;
  const { ac } = audio, o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
}
function updateAudio() {
  if (!audio) return;
  const pct = speed / MAXSPEED, t = audio.ac.currentTime;
  const on = !muted && !paused && (state === 'race' || state === 'countdown' || state === 'finished');
  audio.o.frequency.setTargetAtTime(50 + pct * 160 + (nitroT > 0 ? 35 : 0), t, 0.05);
  audio.g.gain.setTargetAtTime(on ? 0.03 + pct * 0.04 : 0, t, 0.1);
}

// ---------------------------------------------------------------- entrada
const keys = { left: false, right: false, up: false, down: false };
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down' };

function startOrRestart() {
  initAudio();
  if (audio && audio.ac.state === 'suspended') audio.ac.resume();
  if (state === 'menu' || state === 'finished') {
    resetRace(); state = 'countdown'; countdown = 3; lastCount = 4; paused = false;
  }
}
function useNitro() {
  if (state === 'race' && !paused && nitros > 0 && nitroT <= 0) {
    nitros--; nitroT = NITRO_TIME; beep(220, 0.4, 0.06, 'sawtooth');
  }
}
function togglePause() { if (state === 'race' || state === 'countdown') paused = !paused; }

addEventListener('keydown', e => {
  const k = KEYMAP[e.code];
  if (k) { keys[k] = true; e.preventDefault(); return; }
  if (e.code === 'Enter') startOrRestart();
  else if (e.code === 'Space' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') { e.preventDefault(); useNitro(); }
  else if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  else if (e.code === 'KeyM') muted = !muted;
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'race') paused = true; });
canvas.addEventListener('pointerdown', () => { if (paused) paused = false; else startOrRestart(); });

for (const b of document.querySelectorAll('#touch button')) {
  const k = b.dataset.k;
  const down = e => {
    e.preventDefault(); b.classList.add('on');
    if (state === 'menu' || state === 'finished') startOrRestart();
    if (k === 'nitro') useNitro(); else keys[k] = true;
  };
  const up = e => { e.preventDefault(); b.classList.remove('on'); if (k !== 'nitro') keys[k] = false; };
  b.addEventListener('pointerdown', down);
  for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) b.addEventListener(ev, up);
}

// ---------------------------------------------------------------- lógica
function showMsg(text, t = 2) { msg = text; msgT = t; }

function update(dt) {
  if (paused) return;
  if (msgT > 0) msgT -= dt;
  if (shake > 0) shake -= dt;

  if (state === 'countdown') {
    countdown -= dt;
    const c = Math.ceil(countdown);
    if (c !== lastCount && c > 0) { lastCount = c; beep(440, 0.15); }
    if (countdown <= 0) { state = 'race'; beep(880, 0.35); showMsg('VAI!', 1); }
    return;
  }
  if (state !== 'race' && state !== 'finished') return;

  const L = trackLength;
  const playerSeg = findSegment(position + playerZ);
  const pct = speed / MAXSPEED;
  const dx = dt * 2 * pct;
  const control = state === 'race';
  const prevZ = playerCarZ();

  updateCars(dt);
  position = U.increase(position, dt * speed, L);

  // volante + força centrífuga
  if (control) {
    if (keys.left) playerX -= dx;
    else if (keys.right) playerX += dx;
  } else {
    playerX += (0 - playerX) * Math.min(1, dt);
  }
  playerX -= dx * pct * playerSeg.curve * CENTRIFUGAL;

  // aceleração / nitro
  if (nitroT > 0) nitroT -= dt;
  const vmax = MAXSPEED * (nitroT > 0 ? NITRO_BOOST : 1);
  braking = control && keys.down;
  if (!control) speed += (MAXSPEED * 0.5 - speed) * dt;
  else if (nitroT > 0) speed += ACCEL * 2 * dt;
  else if (keys.up) speed += ACCEL * dt;
  else if (keys.down) speed += BRAKE * dt;
  else speed += DECEL * dt;
  if (speed > vmax) speed = Math.max(vmax, speed - MAXSPEED * 0.5 * dt);

  // fora da pista e colisões com cenário
  if (playerX < -1 || playerX > 1) {
    if (speed > OFF_LIMIT) speed += OFF_DECEL * dt;
    for (const sp of playerSeg.sprites) {
      const def = SP[sp.type];
      if (!def.hit) continue;
      const spW = def.w / ROADW;
      const spX = sp.offset + Math.sign(sp.offset) * spW / 2;
      if (U.overlap(playerX, CAR_COLLIDE, spX, spW * def.hit, 1)) {
        speed = MAXSPEED / 5;
        position = U.increase(playerSeg.p1.world.z, -playerZ, L);
        crash();
        break;
      }
    }
  }

  // colisão com rivais (batida na traseira)
  for (const car of playerSeg.cars) {
    if (speed > car.speed && U.overlap(playerX, CAR_COLLIDE, car.offset, CAR_COLLIDE, 0.8)) {
      speed = car.speed * (car.speed / speed);
      position = U.increase(car.z, -playerZ, L);
      crash();
      break;
    }
  }

  playerX = U.clamp(playerX, -3, 3);
  speed = U.clamp(speed, 0, MAXSPEED * NITRO_BOOST);

  // contagem de voltas
  const z = playerCarZ();
  if (z < prevZ - L / 2) onLap(1);
  else if (z > prevZ + L / 2) lap--; // recuou sobre a linha após batida

  if (state === 'race') raceTime += dt;

  skyOff += 0.001 * playerSeg.curve * pct;
  hillOff += 0.002 * playerSeg.curve * pct;
}

function onLap() {
  lap++;
  if (state !== 'race') return;
  if (lap >= 2) {
    lastLap = raceTime - lapStart;
    bestLap = bestLap == null ? lastLap : Math.min(bestLap, lastLap);
  }
  lapStart = raceTime;
  if (lap > LAPS) finishRace();
  else if (lap === LAPS) { showMsg('VOLTA FINAL!', 2.5); beep(660, 0.25); }
  else if (lap > 1) showMsg(`VOLTA ${lap}  •  ${fmt(lastLap)}`, 2.5);
}

function finishRace() {
  state = 'finished';
  finishPos = currentPosition();
  finishTime = raceTime;
  const entries = cars.map(c => ({ name: c.name, color: c.color, prog: carProgress(c) }));
  entries.push({ name: 'VOCÊ', color: PLAYER_COLOR, prog: playerProgress(), me: true });
  standings = entries.sort((a, b) => b.prog - a.prog);
  beep(finishPos === 1 ? 1046 : 523, 0.6, 0.08, 'triangle');
}

function crash() { shake = 0.35; beep(90, 0.25, 0.1, 'sawtooth'); }

function updateCars(dt) {
  const L = trackLength, pp = playerProgress(), carW = CAR_COLLIDE;
  for (const car of cars) {
    const oldSeg = findSegment(car.z);
    car.offset += steerCar(car, oldSeg, carW);
    car.offset = U.clamp(car.offset, -0.9, 0.9);

    // "elástico": rivais aceleram se ficam para trás e aliviam se disparam
    const behind = (pp - carProgress(car)) / L;
    const band = U.clamp(behind * 0.6, -0.15, 0.12);
    const curvePenalty = Math.abs(oldSeg.curve) > 4 ? 0.94 : 1;
    const target = car.base * (1 + band) * curvePenalty;
    car.speed += (target - car.speed) * Math.min(1, dt * 0.5);

    const prev = car.z;
    car.z = U.increase(car.z, dt * car.speed, L);
    if (car.z < prev) car.lap++;
    car.percent = U.pctRem(car.z, SEG);
    const newSeg = findSegment(car.z);
    if (newSeg !== oldSeg) {
      oldSeg.cars.splice(oldSeg.cars.indexOf(car), 1);
      newSeg.cars.push(car);
    }
  }
}

function steerCar(car, carSeg, carW) {
  const playerSeg = findSegment(position + playerZ);
  for (let i = 1; i < 20; i++) {
    const seg = segments[(carSeg.index + i) % segments.length];
    if (seg === playerSeg && car.speed > speed && U.overlap(playerX, CAR_COLLIDE, car.offset, carW, 1.2)) {
      const dir = playerX > 0.5 ? -1 : playerX < -0.5 ? 1 : (car.offset > playerX ? 1 : -1);
      return dir / i * (car.speed - speed) / MAXSPEED;
    }
    for (const other of seg.cars) {
      if (other !== car && car.speed > other.speed && U.overlap(car.offset, carW, other.offset, carW, 1.2)) {
        const dir = other.offset > 0.5 ? -1 : other.offset < -0.5 ? 1 : (car.offset > other.offset ? 1 : -1);
        return dir / i * (car.speed - other.speed) / MAXSPEED;
      }
    }
  }
  return 0;
}

// ---------------------------------------------------------------- render
function project(p, camX, camY, camZ) {
  p.camera.x = -camX;
  p.camera.y = p.world.y - camY;
  p.camera.z = p.world.z - camZ;
  p.screen.scale = camDepth / p.camera.z;
  // arredondar evita frestas anti-aliased entre segmentos
  p.screen.x = Math.round(W / 2 + p.screen.scale * p.camera.x * W / 2);
  p.screen.y = Math.round(H / 2 - p.screen.scale * p.camera.y * H / 2);
  p.screen.w = Math.round(p.screen.scale * ROADW * W / 2);
}

function drawSegment(seg) {
  const a = seg.p1.screen, b = seg.p2.screen, c = seg.color;
  const x1 = a.x, y1 = a.y, w1 = a.w, x2 = b.x, y2 = b.y, w2 = b.w;
  ctx.fillStyle = c.grass; ctx.fillRect(0, y2, W, y1 - y2);
  const r1 = w1 / Math.max(6, 2 * LANES), r2 = w2 / Math.max(6, 2 * LANES);
  poly(x1 - w1 - r1, y1, x1 - w1, y1, x2 - w2, y2, x2 - w2 - r2, y2, c.rumble);
  poly(x1 + w1 + r1, y1, x1 + w1, y1, x2 + w2, y2, x2 + w2 + r2, y2, c.rumble);
  poly(x1 - w1, y1, x1 + w1, y1, x2 + w2, y2, x2 - w2, y2, c.road);
  if (seg.checker) {
    const n = 12;
    for (let i = 0; i < n; i++) {
      const la = x1 - w1 + 2 * w1 * i / n, lb = x1 - w1 + 2 * w1 * (i + 1) / n;
      const ua = x2 - w2 + 2 * w2 * i / n, ub = x2 - w2 + 2 * w2 * (i + 1) / n;
      poly(la, y1, lb, y1, ub, y2, ua, y2, (i + seg.index) % 2 ? '#111' : '#fafafa');
    }
  } else if (c.lane) {
    const l1 = w1 / Math.max(32, 8 * LANES), l2 = w2 / Math.max(32, 8 * LANES);
    for (let lane = 1; lane < LANES; lane++) {
      const lx1 = x1 - w1 + 2 * w1 * lane / LANES, lx2 = x2 - w2 + 2 * w2 * lane / LANES;
      poly(lx1 - l1 / 2, y1, lx1 + l1 / 2, y1, lx2 + l2 / 2, y2, lx2 - l2 / 2, y2, c.lane);
    }
  }
  if (seg.fog < 1) {
    ctx.globalAlpha = 1 - seg.fog; ctx.fillStyle = COLORS.fog;
    ctx.fillRect(0, y2, W, y1 - y2); ctx.globalAlpha = 1;
  }
}

function ridge(off, baseY, amp, color, seed, step = 8) {
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W + step; x += step) {
    const t = x + off;
    const y = baseY - amp * (0.55 + 0.25 * Math.sin(t * 0.011 + seed) + 0.13 * Math.sin(t * 0.027 + seed * 2) + 0.07 * Math.sin(t * 0.061 + seed * 3));
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
}

function drawBackground(playerY) {
  const g = ctx.createLinearGradient(0, 0, 0, H * 0.6);
  g.addColorStop(0, '#1d4f9e'); g.addColorStop(1, COLORS.fog);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,245,200,0.35)'; circle(W * 0.78 - skyOff * 200 % W, H * 0.16, 46);
  ctx.fillStyle = '#fff6d0'; circle(W * 0.78 - skyOff * 200 % W, H * 0.16, 30);
  const shift = U.clamp(playerY * 0.004, -40, 40);
  ridge(skyOff * W * 2, H * 0.52 + shift * 0.5, 120, '#7a93b8', 1.3);
  ridge(hillOff * W * 2, H * 0.56 + shift, 70, '#4f8a5b', 4.1);
}

function drawCar(cx, by, w, col, steer, brake, isPlayer) {
  if (w < 2) return;
  const h = w * 0.52, x = cx - w / 2, s = steer * w * 0.04;
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(cx, by - h * 0.02, w * 0.56, h * 0.1, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#141414';
  ctx.fillRect(x + w * 0.02, by - h * 0.34, w * 0.18, h * 0.34);
  ctx.fillRect(x + w * 0.8, by - h * 0.34, w * 0.18, h * 0.34);
  poly(x + w * 0.14, by - h * 0.7, x + w * 0.86, by - h * 0.7, x + w * 0.74 + s, by - h, x + w * 0.26 + s, by - h, col[1]);
  poly(x + w * 0.21, by - h * 0.72, x + w * 0.79, by - h * 0.72, x + w * 0.7 + s, by - h * 0.94, x + w * 0.3 + s, by - h * 0.94, '#22303d');
  poly(x + w * 0.27 + s, by - h * 0.9, x + w * 0.4 + s, by - h * 0.9, x + w * 0.33, by - h * 0.75, x + w * 0.24, by - h * 0.75, 'rgba(255,255,255,0.18)');
  ctx.fillStyle = col[0]; ctx.fillRect(x, by - h * 0.72, w, h * 0.46);
  ctx.fillStyle = col[1]; ctx.fillRect(x - w * 0.02, by - h * 0.8, w * 1.04, h * 0.07);
  ctx.fillRect(x + w * 0.1, by - h * 0.76, w * 0.04, h * 0.06); ctx.fillRect(x + w * 0.86, by - h * 0.76, w * 0.04, h * 0.06);
  if (isPlayer) { ctx.fillStyle = '#fff'; ctx.fillRect(cx - w * 0.09, by - h * 0.72, w * 0.05, h * 0.46); ctx.fillRect(cx + w * 0.04, by - h * 0.72, w * 0.05, h * 0.46); }
  if (brake) { ctx.fillStyle = 'rgba(255,40,40,0.35)'; ctx.fillRect(x - w * 0.02, by - h * 0.66, w * 0.3, h * 0.24); ctx.fillRect(x + w * 0.72, by - h * 0.66, w * 0.3, h * 0.24); }
  ctx.fillStyle = brake ? '#ff4040' : '#a01010';
  ctx.fillRect(x + w * 0.04, by - h * 0.62, w * 0.2, h * 0.14); ctx.fillRect(x + w * 0.76, by - h * 0.62, w * 0.2, h * 0.14);
  ctx.fillStyle = '#f5f5f5'; ctx.fillRect(cx - w * 0.1, by - h * 0.5, w * 0.2, h * 0.11);
  ctx.fillStyle = '#222'; ctx.fillRect(x + w * 0.06, by - h * 0.3, w * 0.88, h * 0.06);
}

function drawNitroFlame(cx, by, w) {
  const h = w * 0.52;
  for (const ex of [-0.28, 0.28]) {
    const x = cx + ex * w, y = by - h * 0.27, len = h * (0.35 + Math.random() * 0.3);
    poly(x - w * 0.05, y, x + w * 0.05, y, x, y + len, '#ff8f00');
    poly(x - w * 0.025, y, x + w * 0.025, y, x, y + len * 0.6, '#fff59d');
  }
}

function withClip(clipY, fn) {
  if (clipY >= H) { fn(); return; }
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, clipY); ctx.clip(); fn(); ctx.restore();
}

function drawSprite(sp, sx, sy, scale, clipY) {
  const def = SP[sp.type];
  const w = def.w * scale * W / 2, h = def.h * scale * W / 2;
  if (w < 1 || sy - h >= clipY) return;
  const cx = sp.type === 'arch' ? sx : sx + Math.sign(sp.offset) * w / 2;
  withClip(clipY, () => def.draw(cx, sy, w, h, sp));
}

function drawPlayer(playerSeg, playerPct) {
  const camY = U.interp(playerSeg.p1.camera.y, playerSeg.p2.camera.y, playerPct);
  const pct = speed / MAXSPEED;
  const bounce = (Math.random() * 2 - 1) * pct * 1.5;
  const y = H / 2 - (camDepth / playerZ) * camY * H / 2 + bounce;
  const w = CARW * (camDepth / playerZ) * W / 2;
  let steer = 0;
  if (speed > 0 && state === 'race') steer = keys.left ? -1 : keys.right ? 1 : 0;
  if (nitroT > 0) drawNitroFlame(W / 2, y, w);
  drawCar(W / 2, y, w, PLAYER_COLOR, steer, braking, true);
}

function render() {
  const L = trackLength;
  const baseSeg = findSegment(position), basePct = U.pctRem(position, SEG);
  const playerSeg = findSegment(position + playerZ), playerPct = U.pctRem(position + playerZ, SEG);
  const playerY = U.interp(playerSeg.p1.world.y, playerSeg.p2.world.y, playerPct);

  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * 12, (Math.random() - 0.5) * 8);
  drawBackground(playerY);

  let maxy = H, x = 0, dx = -(baseSeg.curve * basePct);
  for (let n = 0; n < DRAW; n++) {
    const seg = segments[(baseSeg.index + n) % segments.length];
    seg.looped = seg.index < baseSeg.index;
    seg.fog = Math.exp(-((n / DRAW) ** 2) * FOG);
    seg.clip = maxy;
    const camZ = position - (seg.looped ? L : 0);
    project(seg.p1, playerX * ROADW - x, playerY + CAMH, camZ);
    project(seg.p2, playerX * ROADW - x - dx, playerY + CAMH, camZ);
    x += dx; dx += seg.curve;
    if (seg.p1.camera.z <= camDepth || seg.p2.screen.y >= seg.p1.screen.y || seg.p2.screen.y >= maxy) continue;
    drawSegment(seg);
    maxy = seg.p1.screen.y;
  }

  for (let n = DRAW - 1; n > 0; n--) {
    const seg = segments[(baseSeg.index + n) % segments.length];
    for (const sp of seg.sprites) {
      const scale = seg.p1.screen.scale;
      drawSprite(sp, seg.p1.screen.x + scale * sp.offset * ROADW * W / 2, seg.p1.screen.y, scale, seg.clip);
    }
    for (const car of seg.cars) {
      const scale = U.interp(seg.p1.screen.scale, seg.p2.screen.scale, car.percent);
      const cx = U.interp(seg.p1.screen.x, seg.p2.screen.x, car.percent) + scale * car.offset * ROADW * W / 2;
      const cy = U.interp(seg.p1.screen.y, seg.p2.screen.y, car.percent);
      const w = CARW * scale * W / 2;
      if (cy - w * 0.52 < seg.clip) withClip(seg.clip, () => drawCar(cx, cy, w, car.color, 0, false, false));
    }
    if (seg === playerSeg) drawPlayer(playerSeg, playerPct);
  }
  ctx.restore();

  drawHUD();
  drawOverlay();
}

// ---------------------------------------------------------------- HUD / telas
function text(str, x, y, size, color = '#fff', align = 'left') {
  ctx.font = `bold ${size}px "Trebuchet MS", system-ui, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillText(str, x + 2, y + 2);
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}

function drawHUD() {
  if (state === 'menu') return;
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(0, 0, W, 64);
  text(`VOLTA ${U.clamp(lap, 1, LAPS)}/${LAPS}`, 16, 8, 22, '#ffeb3b');
  text(`TEMPO ${fmt(raceTime)}`, 16, 36, 18);
  text(`MELHOR ${fmt(bestLap)}`, 190, 36, 18, '#b2ebf2');

  const kmh = Math.round(speed / MAXSPEED * 240);
  text(`${kmh}`, W / 2 + 10, 4, 36, nitroT > 0 ? '#ffab40' : '#fff', 'right');
  text('km/h', W / 2 + 16, 20, 16, '#ddd');
  const bw = 180, bx = W / 2 - bw / 2;
  ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.fillRect(bx, 46, bw, 6);
  ctx.fillStyle = nitroT > 0 ? '#ff9100' : '#4caf50'; ctx.fillRect(bx, 46, bw * U.clamp(speed / (MAXSPEED * NITRO_BOOST), 0, 1), 6);
  for (let i = 0; i < NITRO_COUNT; i++) {
    ctx.fillStyle = i < nitros ? '#ff6d00' : 'rgba(255,255,255,0.2)';
    ctx.fillRect(W / 2 + 70 + i * 22, 12, 16, 22);
  }
  text('N', W / 2 + 70 + NITRO_COUNT * 22 + 4, 12, 18, '#ffab40');

  const pos = state === 'finished' ? finishPos : currentPosition();
  text(`${pos}º`, W - 70, 2, 48, pos === 1 ? '#ffd54f' : '#fff', 'right');
  text(`/${cars.length + 1}`, W - 66, 26, 22, '#ddd');

  if (msgT > 0 && state === 'race') text(msg, W / 2, H * 0.28, 44, '#ffeb3b', 'center');
}

function panel(x, y, w, h) {
  ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#ffeb3b'; ctx.lineWidth = 3; ctx.strokeRect(x, y, w, h);
}

function drawOverlay() {
  const touch = matchMedia('(pointer: coarse)').matches;
  if (state === 'menu') {
    panel(W / 2 - 300, 80, 600, 330);
    text('TURBO ESTRADA', W / 2, 105, 60, '#ffeb3b', 'center');
    text(`${LAPS} voltas  •  ${RIVALS.length} rivais  •  ${NITRO_COUNT} nitros`, W / 2, 180, 20, '#fff', 'center');
    const lines = touch
      ? ['◀ ▶  volante', '▲  acelerar   ▼  frear', 'N  nitro']
      : ['← →  volante', '↑  acelerar   ↓  frear', 'ESPAÇO  nitro   •   P  pausa   •   M  som'];
    lines.forEach((l, i) => text(l, W / 2, 225 + i * 30, 20, '#e0e0e0', 'center'));
    if (Math.floor(performance.now() / 500) % 2) text(touch ? 'TOQUE PARA COMEÇAR' : 'ENTER PARA COMEÇAR', W / 2, 345, 26, '#80d8ff', 'center');
  } else if (state === 'countdown') {
    const c = Math.ceil(countdown);
    text(String(c), W / 2, H * 0.25, 110, c === 1 ? '#ffeb3b' : '#ff5252', 'center');
  } else if (state === 'finished') {
    panel(W / 2 - 260, 80, 520, 380);
    text(finishPos === 1 ? 'VITÓRIA!' : 'FIM DE CORRIDA', W / 2, 96, 44, '#ffeb3b', 'center');
    text(`Você chegou em ${finishPos}º  •  ${fmt(finishTime)}  •  melhor volta ${fmt(bestLap)}`, W / 2, 150, 17, '#fff', 'center');
    standings.forEach((e, i) => {
      const y = 182 + i * 26;
      ctx.fillStyle = e.color[0]; ctx.fillRect(W / 2 - 120, y + 4, 18, 16);
      text(`${i + 1}º  ${e.name}`, W / 2 - 92, y, 19, e.me ? '#ffeb3b' : '#fff');
    });
    text(touch ? 'TOQUE PARA CORRER DE NOVO' : 'ENTER PARA CORRER DE NOVO', W / 2, 400, 22, '#80d8ff', 'center');
  }
  if (paused) {
    panel(W / 2 - 160, H / 2 - 50, 320, 100);
    text('PAUSA', W / 2, H / 2 - 36, 40, '#ffeb3b', 'center');
    text(touch ? 'toque para continuar' : 'P para continuar', W / 2, H / 2 + 12, 18, '#fff', 'center');
  }
}

// ---------------------------------------------------------------- loop
resetRace();
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.25, (now - last) / 1000);
  last = now;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  render();
  updateAudio();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
